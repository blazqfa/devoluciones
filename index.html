<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bormioli · Gestión de Devoluciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef2f4;
  --card:#ffffff;
  --ink:#1f2d34;
  --muted:#65787f;
  --line:#dfe6e9;
  --brand:#0e5b76;
  --brand-dark:#0a3f52;
  --brand-soft:#e4eff2;
  --accent:#c98a3e;
  --ok:#2f8f5b;
  --ok-soft:#e5f4ec;
  --warn:#b8862c;
  --warn-soft:#faf1de;
  --danger:#b7452f;
  --danger-soft:#fbe9e4;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,40,50,.06), 0 8px 24px rgba(20,40,50,.06);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
#app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:12px;}
.logo img{display:block;height:46px;width:auto;object-fit:contain;}
.logo-text{font-weight:600;font-size:11px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;padding-left:12px;border-left:1.5px solid var(--line);}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 15%,#f4f8f9,var(--bg) 60%);}
.login-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:38px 34px;width:100%;max-width:420px;}
.login-card .logo{justify-content:center;margin-bottom:22px;flex-direction:column;gap:10px;box-shadow:none;padding:10px 14px;}
.login-card .logo img{height:92px;}
.login-card .logo-text{border-left:none;padding-left:0;font-size:12.5px;}
.login-card h1{font-size:17px;text-align:center;color:var(--muted);font-weight:500;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fbfcfd;transition:border-color .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);background:#fff;}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:transform .05s, opacity .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-block{width:100%;}
.btn-secondary{background:var(--brand-soft);color:var(--brand-dark);}
.btn-outline{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ok{background:var(--ok-soft);color:var(--ok);}
.btn-warn{background:var(--warn-soft);color:var(--warn);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.error-msg{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px;}
.demo-users{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;}

/* ---------- Top nav ---------- */
.topbar-wrap{background:var(--bg);position:sticky;top:0;width:100%;z-index:20;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;padding:14px 16px;max-width:1180px;margin:0 auto;}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;row-gap:6px;}
.who .badge{background:var(--brand-soft);color:var(--brand-dark);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-ok{background:var(--ok);}
.sync-bad{background:var(--danger);}
.who .name{font-weight:600;font-size:14.5px;}
.logout{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;}
@media(max-width:640px){
  .topbar .logo img{height:38px !important;}
  .topbar .logo-text{font-size:9.5px;padding-left:8px;}
  .sync-status .sync-label{display:none;}
  .who{gap:8px;}
  .who .badge{padding:3px 8px;font-size:10.5px;}
  .who .name{font-size:13px;}
  #btnRefresh{padding:5px 9px;}
  .login-card{padding:34px 26px;max-width:100%;}
  .login-card .logo img{height:110px !important;}
  .login-card .logo-text{font-size:14px;}
  .login-card h1{font-size:18px;}
  .field input,.field select{font-size:16px;padding:13px 14px;}
  .btn-block{padding:14px 18px;font-size:16px;}
}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:18px;border-bottom:1.5px solid var(--line);}
.tab{padding:9px 15px;border-radius:9px 9px 0 0;background:transparent;border:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;}
.tab.active{background:var(--card);color:var(--brand-dark);box-shadow:var(--shadow);}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
.card h2{margin:0 0 4px;font-size:18px;}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr;}}

.radio-row{display:flex;gap:10px;margin-bottom:16px;}
.radio-chip{flex:1;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);background:#fbfcfd;}
.radio-chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);}

.autocomplete{position:relative;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:240px;overflow-y:auto;z-index:30;box-shadow:0 10px 20px rgba(0,0,0,.08);}
.ac-item{padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line);}
.ac-item:hover{background:var(--brand-soft);cursor:pointer;}
.ac-item b{color:var(--brand-dark);}
.ac-item span{display:block;color:var(--muted);font-size:12px;}
.ac-empty{padding:10px 13px;font-size:13px;color:var(--muted);}

.desc-preview{background:var(--brand-soft);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--brand-dark);min-height:22px;margin-bottom:2px;}

/* ---------- Tables / lists ---------- */
table{width:100%;border-collapse:collapse;font-size:13.8px;}
th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:2px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.row-confirmado{background:var(--ok-soft);}
.tbl-wrap{overflow-x:auto;}

.pl-card{border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.pl-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;background:#fbfcfd;flex-wrap:wrap;gap:8px;}
.pl-head:hover{background:var(--brand-soft);}
.pl-num{font-weight:700;color:var(--brand-dark);font-size:14.5px;}
.pl-meta{font-size:12px;color:var(--muted);}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.st-enviada{background:var(--warn-soft);color:var(--warn);}
.st-draft{background:#eee;color:var(--muted);}
.st-comprobada{background:var(--brand-soft);color:var(--brand-dark);}
.st-ubicar{background:var(--warn-soft);color:var(--warn);}
.st-ubicado{background:#e6f1fb;color:#0c447c;}
.st-ok{background:var(--ok-soft);color:var(--ok);}
.pl-body{padding:16px;border-top:1.5px solid var(--line);display:none;}
.pl-body.open{display:block;}
.block-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;}
.block-title:first-child{margin-top:0;}
.total-row{display:flex;justify-content:space-between;font-weight:700;padding:8px 10px;font-size:13.5px;color:var(--brand-dark);}
.pl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.user-group{margin-bottom:22px;}
.user-group>summary{font-weight:700;font-size:14.5px;color:var(--brand-dark);cursor:pointer;padding:8px 0;list-style:none;}
.user-group>summary::-webkit-details-marker{display:none;}
.user-group>summary:before{content:"▸ ";}
.user-group[open]>summary:before{content:"▾ ";}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,35,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 8px;font-size:17px;}
.modal p{color:var(--muted);font-size:14px;line-height:1.5;}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* ---------- Config ---------- */
.subtabs{display:flex;gap:8px;margin-bottom:16px;}
.subtab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);}
.subtab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.search-box{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:14px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 25px rgba(0,0,0,.2);}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:32px;margin-bottom:8px;}
.tag-otro{background:var(--danger-soft);color:var(--danger);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}

/* ---------- Print ---------- */
#printArea{display:none;}
@media print{
  body>*{display:none !important;}
  #printArea{display:block !important;}
  html,body{background:#fff !important;}
  @page{size:A4 landscape;margin:10mm;}
  @page pldoc{size:A4 portrait;margin:14mm;}
}
.pl-doc-page{page:pldoc;font-family:Arial,Helvetica,sans-serif;color:#000;filter:grayscale(1);background:#fff;box-sizing:border-box;width:100%;}
.pldoc-title{text-align:center;margin-bottom:6mm;}
.pldoc-title img{height:14mm;}
.pldoc-title h1{font-size:16pt;margin:3mm 0 0;letter-spacing:1px;}
.pldoc-companies{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-bottom:6mm;}
.pldoc-box{border:1.2px solid #000;border-radius:2mm;padding:4mm 5mm;font-size:9.5pt;line-height:1.5;}
.pldoc-box b{display:block;font-size:8pt;text-transform:uppercase;letter-spacing:.6px;color:#333;margin-bottom:1.5mm;}
.pldoc-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4mm;border:1.2px solid #000;border-radius:2mm;padding:4mm 5mm;margin-bottom:6mm;font-size:9.5pt;}
.pldoc-meta div b{display:block;font-size:8pt;text-transform:uppercase;color:#333;}
.pldoc-block-title{font-size:10.5pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:5mm 0 2mm;border-bottom:1.5px solid #000;padding-bottom:1mm;}
.pldoc-table{width:100%;border-collapse:collapse;font-size:9pt;}
.pldoc-table th{text-align:left;border-bottom:1.2px solid #000;padding:1.5mm 2mm;font-size:8pt;text-transform:uppercase;}
.pldoc-table td{padding:1.5mm 2mm;border-bottom:0.5px solid #999;}
.pldoc-total{display:flex;justify-content:flex-end;font-weight:800;font-size:10pt;padding:2mm;}
.pldoc-grand{display:flex;justify-content:flex-end;font-weight:800;font-size:12pt;margin-top:4mm;border-top:1.5px solid #000;padding-top:2mm;}
.pldoc-firmas{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:14mm;font-size:9pt;}
.pldoc-firmas div{border-top:1px solid #000;padding-top:2mm;text-align:center;}
.print-page{width:277mm;height:190mm;display:flex;align-items:center;justify-content:center;break-after:page;page-break-after:always;}
.print-page:last-child{break-after:auto;page-break-after:auto;}
.label-sheet{width:250mm;height:158mm;position:relative;font-family:Arial,Helvetica,sans-serif;border:1.5px solid #000;border-radius:4px;display:flex;filter:grayscale(1);background:#fff;}
.label-left{width:62mm;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1.5px solid #000;padding:8mm;text-align:center;}
.label-logo-img{width:100%;max-height:26mm;object-fit:contain;}
.label-user{margin-top:6mm;font-size:13pt;font-weight:700;color:#000;letter-spacing:.5px;text-transform:uppercase;}
.label-user-sub{font-size:9pt;color:#333;margin-top:1mm;}
.label-right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8mm 10mm;gap:3mm;}
.label-type{display:inline-block;background:#000;color:#fff;font-size:13pt;font-weight:700;padding:2.5mm 7mm;border-radius:5mm;letter-spacing:2px;}
.label-code{font-size:38pt;font-weight:800;letter-spacing:1px;color:#000;line-height:1.05;word-break:break-word;}
.label-desc{font-size:16pt;font-weight:600;color:#000;line-height:1.3;max-width:100%;}
.label-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;width:100%;max-width:150mm;margin-top:1mm;}
.label-box{border:1.5px solid #000;border-radius:3mm;padding:3mm 5mm;text-align:center;}
.label-box .lb{font-size:9.5pt;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:1.2px;}
.label-box .lv{font-size:26pt;font-weight:800;color:#000;margin-top:1mm;}
.label-barcode{margin-top:1mm;}
.label-barcode svg{max-width:100%;height:16mm;}
.label-bottom-row{display:flex;align-items:center;justify-content:center;gap:8mm;margin-top:2mm;}
.label-qr{width:22mm;height:22mm;}
.label-qr img{width:100%;height:100%;}
.label-datetime{font-size:9pt;color:#000;text-align:left;}
.label-datetime b{display:block;font-size:9.5pt;}
</style>
</head>

<script>

/* =========================================================
   CONEXIÓN CON EL BACKEND (Google Apps Script + Google Sheets)
   ---------------------------------------------------------
   1) Despliega Code.gs como Aplicación web (ver instrucciones
      dentro de ese archivo) y copia la URL que termina en /exec.
   2) Pega esa URL aquí abajo, en APPS_SCRIPT_URL.
   Mientras APPS_SCRIPT_URL no esté configurada, la app funciona
   en modo local (solo en tu navegador, sin compartir datos).
========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-6KQcLAJzE8HLlFAw1V-1BWElTyd_MGC45l72SMAhZ_unzktsQ5GrkgC2CdRL2gWLDA/exec";
const HAS_BACKEND = !!APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('PEGA_AQUI');

const memoryStore = {}; // fallback usado solo si no hay backend configurado
let SYNC_OK = false;
let LAST_SYNC = null;

function setSyncStatus(ok){
  SYNC_OK = ok;
  const el = document.getElementById('syncDot');
  if(el){ el.className = 'sync-dot ' + (ok?'sync-ok':'sync-bad'); }
  const t = document.getElementById('syncText');
  if(t){ t.textContent = HAS_BACKEND ? (ok ? ('Sincronizado · '+fmtDateTime(new Date())) : 'Sin conexión') : 'Modo local (sin backend)'; }
}

function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms||12000);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).finally(()=>clearTimeout(id));
}

async function apiGetAll(){
  if(!HAS_BACKEND) return null;
  try{
    const res = await fetchWithTimeout(`${APPS_SCRIPT_URL}?action=getAll&_=${Date.now()}`, {cache:'no-store'}, 40000);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'error');
    setSyncStatus(true);
    return j.data; // { key: "jsonString", ... }
  }catch(e){ console.error('apiGetAll error', e); setSyncStatus(false); return null; }
}

async function apiSet(key, value){
  if(!HAS_BACKEND){ memoryStore[key]=JSON.stringify(value); return true; }
  try{
    const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      cache:'no-store',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS
      body: JSON.stringify({action:'set', key, value: JSON.stringify(value)})
    }, 40000);
    const j = await res.json();
    setSyncStatus(!!j.ok);
    return !!j.ok;
  }catch(e){ console.error('apiSet error', e); setSyncStatus(false); return false; }
}

async function apiDelete(key){
  if(!HAS_BACKEND){ delete memoryStore[key]; return true; }
  try{
    const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      cache:'no-store',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'delete', key})
    }, 40000);
    const j = await res.json();
    setSyncStatus(!!j.ok);
    return !!j.ok;
  }catch(e){ console.error('apiDelete error', e); setSyncStatus(false); return false; }
}

// Guarda varias keys en UNA sola petición atómica (un solo bloqueo en el servidor).
// Se usa para la BBDD de artículos, para que Vidrio y Embalaje se guarden juntos
// y nunca queden a medias.
async function apiSetMany(items){
  if(!HAS_BACKEND){ Object.keys(items).forEach(k=>{ memoryStore[k]=JSON.stringify(items[k]); }); return true; }
  try{
    const payload = {};
    Object.keys(items).forEach(k=>{ payload[k] = JSON.stringify(items[k]); });
    const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      cache:'no-store',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'setMany', items: payload})
    }, 60000);
    const j = await res.json();
    setSyncStatus(!!j.ok);
    return !!j.ok;
  }catch(e){ console.error('apiSetMany error', e); setSyncStatus(false); return false; }
}

// Genera el número de packing list de forma atómica en el servidor
// (evita duplicados si dos personas envían a la vez).
async function apiNextNumero(letra){
  if(!HAS_BACKEND){
    const year = new Date().getFullYear();
    const key = letra+'-'+year;
    DB.counters[key] = (DB.counters[key]||0)+1;
    apiSet('counters', DB.counters);
    return `${letra}-${year}-${String(DB.counters[key]).padStart(4,'0')}`;
  }
  try{
    const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      cache:'no-store',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'nextNumero', letra, year:new Date().getFullYear()})
    }, 12000);
    const j = await res.json();
    setSyncStatus(!!j.ok);
    if(j.ok) return j.numero;
  }catch(e){ console.error('apiNextNumero error', e); setSyncStatus(false); }
  // fallback local si falla la red, para no bloquear al usuario
  const year = new Date().getFullYear();
  return `${letra}-${year}-${String(Date.now()).slice(-4)}`;
}

// --- Autenticación: las contraseñas SOLO se comprueban en el servidor.
// El navegador nunca descarga la lista de contraseñas de los demás usuarios. ---
async function apiPost(action, extra){
  const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
    method:'POST', cache:'no-store',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, extra))
  }, 15000);
  return res.json();
}
async function apiLogin(usuario, password){
  if(!HAS_BACKEND){
    const u = (DB.users && DB.users.length ? DB.users : defaultUsers())
      .find(x=>x.usuario.toLowerCase()===usuario.trim().toLowerCase() && x.password===password && x.activo!==false);
    return u ? {ok:true, user:{usuario:u.usuario, rol:u.rol, letra:u.letra, activo:u.activo}} : {ok:false};
  }
  try{ return await apiPost('login', {usuario, password}); }
  catch(e){ console.error('apiLogin error', e); return {ok:false, error:'network'}; }
}
async function apiSetPassword(usuario, newPassword){
  if(!HAS_BACKEND) return true;
  try{ const j=await apiPost('setPassword', {usuario, newPassword}); return !!j.ok; }
  catch(e){ console.error('apiSetPassword error', e); return false; }
}
async function apiAddUser(user){
  if(!HAS_BACKEND) return true;
  try{ const j=await apiPost('addUser', {user}); return j; }
  catch(e){ console.error('apiAddUser error', e); return {ok:false}; }
}
async function apiUpdateUserMeta(usuario, patch){
  if(!HAS_BACKEND) return true;
  try{ const j=await apiPost('updateUserMeta', Object.assign({usuario}, patch)); return !!j.ok; }
  catch(e){ console.error('apiUpdateUserMeta error', e); return false; }
}
async function apiSeedUsersIfMissing(users){
  if(!HAS_BACKEND) return;
  try{ await apiPost('seedUsers', {users}); }catch(e){ console.error('apiSeedUsersIfMissing error', e); }
}

function parseKV(kv, key, fallback){
  if(!kv || kv[key]===undefined || kv[key]===null || kv[key]==='') return fallback;
  try{ return JSON.parse(kv[key]); }catch(e){ return fallback; }
}

// Cada packing list se guarda en SU PROPIA key ('pl:<id>'), no todos juntos en un
// único bloque. Así, si dos tercistas guardan casi a la vez, cada uno solo escribe
// su propia key y nunca puede pisar por accidente los packing lists de otro usuario.
function packingListsFromKV(kv){
  return Object.keys(kv)
    .filter(k=>k.indexOf('pl:')===0)
    .map(k=>{ try{ return JSON.parse(kv[k]); }catch(e){ return null; } })
    .filter(Boolean);
}

async function loadAll(){
  let kv = HAS_BACKEND ? await apiGetAll() : null;
  if(!kv) kv = memoryStore;

  // DB.users NUNCA contiene contraseñas cuando hay backend: el servidor ya
  // las quita antes de responder (ver Code.gs, acción getAll). El login real
  // se valida aparte con apiLogin(), que consulta al servidor.
  DB.users = parseKV(kv,'users',null) || (HAS_BACKEND ? [] : defaultUsers());
  DB.vidrio = parseKV(kv,'articulos_vidrio',null) || seedVidrio();
  DB.embalaje = parseKV(kv,'articulos_embalaje',null) || seedEmbalaje();
  DB.counters = parseKV(kv,'counters',{});
  DB.packinglists = packingListsFromKV(kv);
  DB.empresas = parseKV(kv,'empresas',null) || seedEmpresas();
  DB.choferes = parseKV(kv,'choferes',null) || seedChoferes();
  DB.stockEmbalaje = parseKV(kv,'stock_embalaje',null) || [];

  // Migración de instalaciones antiguas: si aún existe el bloque único
  // 'packinglists' de versiones anteriores, se reparte en keys individuales
  // una sola vez y se borra el bloque viejo.
  const legacy = parseKV(kv,'packinglists',null);
  if(legacy && legacy.length && HAS_BACKEND){
    for(const p of legacy){ await apiSet('pl:'+p.id, p); }
    DB.packinglists = legacy;
    await apiDelete('packinglists');
  }

  // Primer arranque: si el servidor todavía no tiene usuarios, los crea con
  // una acción dedicada que solo escribe si la key está vacía (nunca
  // sobreescribe usuarios reales). NUNCA reescribimos la BBDD de artículos
  // aquí: si el servidor no respondiera bien un GET puntual, esto podría
  // sobreescribir un catálogo real con los artículos de ejemplo — así que la
  // BBDD solo se guarda cuando el usuario la importa o edita explícitamente.
  if(!kv['users']){
    await apiSeedUsersIfMissing(defaultUsers());
    const kv2 = await apiGetAll();
    if(kv2) DB.users = parseKV(kv2,'users',null) || DB.users;
  }
  if(!kv['empresas']) await apiSet('empresas', DB.empresas);
  if(!kv['choferes']) await apiSet('choferes', DB.choferes);
}

// NOTA: ya no existe persistUsers() genérico — los usuarios se gestionan con
// acciones dedicadas (login/setPassword/addUser/updateUserMeta) para que las
// contraseñas de unos usuarios nunca pasen por el navegador de otro.
function persistArticulos(){ return apiSetMany({articulos_vidrio: DB.vidrio, articulos_embalaje: DB.embalaje}); }
// Guarda SOLO el packing list indicado (no la lista entera) — evita que dos
// usuarios se pisen los cambios el uno al otro.
function savePL(pl){ return apiSet('pl:'+pl.id, pl); }
function deletePLRemote(id){ return apiDelete('pl:'+id); }
function persistCounters(){ return apiSet('counters', DB.counters); }
function persistEmpresas(){ return apiSet('empresas', DB.empresas); }
function persistChoferes(){ return apiSet('choferes', DB.choferes); }
function persistStockEmbalaje(){ return apiSet('stock_embalaje', DB.stockEmbalaje); }

/* Refresca los datos desde el servidor y vuelve a pintar (para ver lo que añaden otros usuarios) */
async function refreshFromServer(silent){
  if(!HAS_BACKEND) return;
  const kv = await apiGetAll();
  if(!kv) return;
  DB.users = parseKV(kv,'users',DB.users);
  DB.vidrio = parseKV(kv,'articulos_vidrio',DB.vidrio);
  DB.embalaje = parseKV(kv,'articulos_embalaje',DB.embalaje);
  DB.counters = parseKV(kv,'counters',DB.counters);
  DB.packinglists = packingListsFromKV(kv);
  DB.empresas = parseKV(kv,'empresas',DB.empresas);
  DB.choferes = parseKV(kv,'choferes',DB.choferes);
  DB.stockEmbalaje = parseKV(kv,'stock_embalaje',DB.stockEmbalaje);
  if(document.querySelector('.modal-bg')) return; // no interrumpir si hay un modal abierto
  const activeTag = document.activeElement && document.activeElement.tagName;
  if(activeTag==='INPUT' || activeTag==='TEXTAREA' || activeTag==='SELECT') return; // no interrumpir mientras el usuario está escribiendo
  if(SESSION) render();
  if(!silent) toast('Datos actualizados.');
}

// Escapa HTML para evitar que texto libre introducido por cualquier usuario
// (descripciones, direcciones, nombres de chófer, código "OTRO", etc.) se
// interprete como HTML/JS al mostrarlo en la pantalla de otro usuario.
function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function fmtDateTime(d){
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------------- Modal helper ---------------- */
function showModal({title, body, actions}){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${title}</h3><p>${body}</p><div class="modal-actions" id="modalActions"></div></div>`;
  document.body.appendChild(bg);
  const wrap=bg.querySelector('#modalActions');
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'btn-outline');
    b.textContent=a.label;
    b.onclick=()=>{ bg.remove(); a.onClick&&a.onClick(); };
    wrap.appendChild(b);
  });
  bg.onclick=(e)=>{ if(e.target===bg && actions.some(a=>a.dismiss)) bg.remove(); };
}

/* ---------------- Article lookup ---------------- */
function articleList(tipo){ return tipo==='VIDRIO' ? DB.vidrio : DB.embalaje; }
function findArticulo(tipo, codigo){
  const list = articleList(tipo);
  const c = String(codigo).trim().toUpperCase();
  return list.find(r=>String(r[0]).trim().toUpperCase()===c);
}
// Returns the OTHER tipo's name if the code exists there but not in the given tipo (mismatched material warning)
function crossTypeMismatch(tipo, codigo){
  if(!codigo || !codigo.trim()) return null;
  const otherTipo = tipo==='VIDRIO' ? 'EMBALAJE' : 'VIDRIO';
  if(findArticulo(tipo, codigo)) return null; // exists correctly in current tipo
  const foundOther = findArticulo(otherTipo, codigo);
  return foundOther ? otherTipo : null;
}
function searchArticulos(tipo, q){
  q = q.trim().toUpperCase();
  if(!q) return [];
  const list = articleList(tipo);
  return list.filter(r => String(r[0]).toUpperCase().includes(q) || String(r[1]).toUpperCase().includes(q)).slice(0,12);
}

  topbarRoot.innerHTML = renderTopbar();
  app.innerHTML = renderTabs() + '<div id="content"></div>';
  bindTopbar();
  renderContent();
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">${logoSvg(92)}<div class="logo-text">Devolución de material</div></div>
      ${!HAS_BACKEND ? `<div class="error-msg" style="text-align:left;">⚠️ Backend no configurado: la app funciona solo en este navegador y no se compartirá con nadie más. Configura <code>APPS_SCRIPT_URL</code> en el archivo HTML (ver Code.gs).</div>` : ''}
      <h1>Accede con tu usuario de almacén</h1>
      <div id="loginError"></div>
      <div class="field"><label>Usuario</label><input id="inUser" placeholder="Ej. BLalmacen" autocomplete="username"></div>
      <div class="field">
        <label>Contraseña</label>
        <input id="inPass" type="password" placeholder="••••••" autocomplete="current-password">
        <label style="display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:7px;cursor:pointer;">
          <input type="checkbox" id="chkShowPass" style="width:auto;"> Mostrar contraseña
        </label>
      </div>
      <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      <div class="demo-users">Cada usuario gestiona su propio material.<br>El administrador tiene acceso completo.</div>
    </div>
  </div>`;
}
function bindLogin(){
  const doIt=async ()=>{
    const btn=document.getElementById('btnLogin');
    if(LOAD_PROMISE){
      btn.disabled=true; const prevText=btn.textContent; btn.textContent='Cargando datos…';
      await LOAD_PROMISE;
      btn.disabled=false; btn.textContent=prevText;
    }
    const u=document.getElementById('inUser').value, p=document.getElementById('inPass').value;
    if(!u.trim() || !p){ document.getElementById('loginError').innerHTML=`<div class="error-msg">Introduce usuario y contraseña.</div>`; return; }
    btn.disabled=true; const prevText2=btn.textContent; btn.textContent='Comprobando…';
    const result = await doLogin(u,p);
    btn.disabled=false; btn.textContent=prevText2;
    if(result && result.ok){ SESSION=result.user; VIEW = result.user.rol==='capataz'?'comprobacion':'nueva'; render(); }
    else document.getElementById('loginError').innerHTML=`<div class="error-msg">Usuario o contraseña incorrectos.</div>`;
  };
  document.getElementById('btnLogin').onclick=doIt;
  document.getElementById('inPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doIt(); });
  document.getElementById('chkShowPass').onchange=(e)=>{ document.getElementById('inPass').type = e.target.checked ? 'text' : 'password'; };
}

              ${formState.lotes.length>1?`<button class="btn btn-danger btn-sm" data-lote-del="${idx}" title="Quitar este lote">✕</button>`:''}
            </div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn btn-outline btn-sm" id="btnAddLote" style="margin:2px 0 16px;">➕ Añadir otro lote (mismo artículo, distinta cantidad)</button>

function bindNuevaEtiqueta(){
  document.querySelectorAll('[data-tipo]').forEach(b=>{
    b.onclick=()=>{ formState.tipo=b.dataset.tipo; formState.codigo=''; formState.descripcion=''; formState.otro=false; formState.lotes=[{pallets:'',piezas:''}]; renderContent(); };
  });
  const codigoInput=document.getElementById('fCodigo');
  document.getElementById('fOtro').onchange=(e)=>{ formState.otro=e.target.checked; formState.codigo=''; formState.descripcion=''; renderContent(); };

  function showMismatchWarning(){
    const w = document.getElementById('mismatchWarning');
    if(!w) return;
    if(formState.otro){ w.innerHTML=''; return; }
    const otherTipo = crossTypeMismatch(formState.tipo, formState.codigo);
    if(otherTipo){
      w.innerHTML = `<div class="error-msg" style="margin-top:8px;">⚠️ El código <b>${formState.codigo}</b> pertenece a <b>${otherTipo}</b>, no a ${formState.tipo}.
        <button class="btn btn-sm btn-outline" style="margin-top:6px;" id="btnSwitchTipo">Cambiar a ${otherTipo}</button></div>`;
      const sw = document.getElementById('btnSwitchTipo');
      if(sw) sw.onclick=()=>{
        formState.tipo = otherTipo;
        const found = findArticulo(otherTipo, formState.codigo);
        if(found) formState.descripcion = found[1];
        renderContent();
      };
    } else { w.innerHTML=''; }
  }

  if(formState.otro){
    codigoInput.oninput=(e)=>{ formState.codigo=e.target.value; };
    document.getElementById('fDescManual').oninput=(e)=>{ formState.descripcion=e.target.value; };
  } else {
    codigoInput.oninput=(e)=>{
      formState.codigo=e.target.value;
      const results = searchArticulos(formState.tipo, e.target.value);
      const acList=document.getElementById('acList');
      if(!e.target.value.trim()){ acList.innerHTML=''; document.getElementById('mismatchWarning').innerHTML=''; return; }
      acList.innerHTML = `<div class="ac-list">${
        results.length ? results.map(r=>`<div class="ac-item" data-code="${escapeHtml(r[0])}" data-desc="${(r[1]||'').replace(/"/g,'&quot;')}"><b>${escapeHtml(r[0])}</b><span>${escapeHtml(r[1]||'')}</span></div>`).join('')
        : `<div class="ac-empty">Sin coincidencias en la base de datos.</div>`
      }</div>`;
      acList.querySelectorAll('.ac-item').forEach(item=>{
        item.onclick=()=>{
          formState.codigo=item.dataset.code;
          formState.descripcion=item.dataset.desc;
          acList.innerHTML='';
          renderContent();
        };
      });
      showMismatchWarning();
    };
    codigoInput.onblur=()=>{
      setTimeout(()=>{
        const found=findArticulo(formState.tipo, formState.codigo);
        if(found){ formState.descripcion=found[1]; renderContent(); }
        else { showMismatchWarning(); }
      },150);
    };
    showMismatchWarning();
  }

  document.querySelectorAll('.lote-pallets').forEach(inp=>{ inp.oninput=(e)=>{ formState.lotes[inp.dataset.idx].pallets=e.target.value; }; });
  document.querySelectorAll('.lote-piezas').forEach(inp=>{ inp.oninput=(e)=>{ formState.lotes[inp.dataset.idx].piezas=e.target.value; }; });
  document.getElementById('btnAddLote').onclick=()=>{ formState.lotes.push({pallets:'',piezas:''}); renderContent(); };
  document.querySelectorAll('[data-lote-del]').forEach(b=>{
    b.onclick=()=>{ formState.lotes.splice(Number(b.dataset.loteDel),1); renderContent(); };
  });

  document.getElementById('btnLimpiar').onclick=()=>{ formState={tipo:formState.tipo, codigo:'', descripcion:'', otro:false, lotes:[{pallets:'',piezas:''}]}; renderContent(); };

  document.getElementById('btnGenerar').onclick=async ()=>{
    if(!formState.codigo.trim()){ toast('Introduce un código de artículo.'); return; }
    if(!formState.otro && !formState.descripcion){ toast('Ese código no existe en la base de datos. Marca "OTRO" si es necesario.'); return; }
    if(!formState.otro){
      const otherTipo = crossTypeMismatch(formState.tipo, formState.codigo);
      if(otherTipo){ toast(`Este código pertenece a ${otherTipo}, no a ${formState.tipo}. Cambia el tipo de material.`); return; }
    }
    for(let i=0;i<formState.lotes.length;i++){
      const l = formState.lotes[i];
      if(!l.pallets || Number(l.pallets)<=0){ toast(`Indica la cantidad de pallets del lote ${i+1}.`); return; }
      if(!l.piezas || Number(l.piezas)<=0){ toast(`Indica las piezas por pallet del lote ${i+1}.`); return; }
    }

    // Un artículo por cada lote (misma referencia, cantidades distintas). Cada
    // uno se guarda como su propia línea — nunca se suman entre sí aunque
    // coincida el código, para no perder la diferencia de piezas/pallet.
    const items = formState.lotes.map(l => ({
      id: 'it_'+Date.now()+Math.random().toString(36).slice(2,6)+'_'+Math.random().toString(36).slice(2,4),
      tipo: formState.tipo,
      codigo: formState.codigo.trim(),
      descripcion: formState.descripcion.trim() || '(sin descripción)',
      piezasPorPallet: Number(l.piezas)||0,
      cantidadPallet: Number(l.pallets),
      otro: formState.otro
    }));

    // Admin y BLalmacén (rol "almacen") son personal interno: al imprimir/añadir
    // una etiqueta, el packing list se crea y se envía directamente a
    // Comprobación, sin el paso intermedio de "vista previa y enviar" — así
    // Admin puede pasarlo a ENTRADA OK en el acto. Los demás tercistas siguen
    // acumulando artículos en su packing list como hasta ahora.
    const esInterno = SESSION.rol==='almacen' || SESSION.rol==='admin';

    async function autoEnviar(pl, mensaje){
      await confirmSendPL(pl.id, true); // true = salta la revisión del capataz
      toast(mensaje);
      // Admin tiene pestaña "Comprobación" para validarlo ahí mismo; BLalmacén
      // ya no tiene esa pestaña (solo ve lo suyo), así que va a "Mis packing lists".
      VIEW = SESSION.rol==='admin' ? 'comprobacion' : 'mislistas';
      render();
    }
    function resetForm(){ formState={tipo:formState.tipo, codigo:'', descripcion:'', otro:false, lotes:[{pallets:'',piezas:''}]}; }

    if(formState.tipo==='EMBALAJE'){
      printLabels(items, async ()=>{
        if(esInterno){
          let pl; items.forEach(it=>{ pl = addItemToPL(it); });
          resetForm();
          await autoEnviar(pl, `${items.length>1?items.length+' etiquetas impresas':'Etiqueta impresa'}. Pendiente de validar (ENTRADA OK).`);
        } else {
          showModal({
            title:'¿Agregar al packing list?',
            body: items.length>1
              ? `${items.length} lotes de ${items[0].codigo} (${items.reduce((s,i)=>s+i.cantidadPallet,0)} pallets en total). ¿Quieres añadirlos a tu packing list en curso?`
              : `${items[0].codigo} — ${items[0].cantidadPallet} pallet(s). ¿Quieres añadirlo a tu packing list en curso?`,
            actions:[
              {label:'No, gracias', cls:'btn-outline', dismiss:true},
              {label:'Sí, agregar', cls:'btn-primary', onClick:()=>{ items.forEach(it=>addItemToPL(it)); toast('Añadido al packing list.'); resetForm(); renderContent(); }}
            ]
          });
        }
      });
    } else {
      let pl; items.forEach(it=>{ pl = addItemToPL(it); });
      resetForm();
      if(esInterno){
        await autoEnviar(pl, 'Añadido. Pendiente de validar (ENTRADA OK).');
      } else {
        toast(items.length>1 ? `${items.length} lotes añadidos al packing list.` : 'Añadido al packing list.');
        renderContent();
      }
    }
  };
}

/* Get or create the active (draft) PL for current user */
function getActivePL(forceNew){
  if(!forceNew){
    const existing = DB.packinglists.filter(p=>p.usuario===SESSION.usuario && p.enviado===false).sort((a,b)=>b.creado-a.creado)[0];
    if(existing) return existing;
  }
  const pl = {
    id: 'pl_'+Date.now()+Math.random().toString(36).slice(2,6),
    numero: null,
    usuario: SESSION.usuario,
    creado: Date.now(),
    estado: 'SOL. ENVIADA',
    enviado: false,
    historialEstados: [],
    items: []
  };
  DB.packinglists.push(pl);
  return pl;
}

async function confirmSendPL(plId, skipCapataz){
  const p = DB.packinglists.find(x=>x.id===plId);
  if(!p) return;
  const letra = (DB.users.find(u=>u.usuario===p.usuario)||{}).letra || 'X';
  if(!p.numero) p.numero = await apiNextNumero(letra);
  p.enviado = true;
  p.fechaEnvio = Date.now();
  if(skipCapataz){
    // Admin/BLalmacén: no necesitan revisión del capataz, pasa directo a
    // pendiente de validar por Admin (ENTRADA OK).
    p.estado = 'COMPROBADA';
    p.historialEstados.push({estado:'COMPROBADA', usuario:SESSION.usuario+' (envío interno, sin capataz)', fecha:Date.now()});
  } else {
    p.historialEstados.push({estado:'SOL. ENVIADA', usuario:SESSION.usuario, fecha:Date.now()});
  }
  await savePL(p);
}

function addItemToPL(item, forceNew){
  const pl = getActivePL(forceNew);
  if(!item.otro){
    // Solo se fusiona con una línea existente si además coincide piezas/pallet:
    // así dos lotes del mismo código con cantidades distintas nunca se mezclan
    // y se pierda esa diferencia.
    const existing = pl.items.find(i=>i.tipo===item.tipo && i.codigo===item.codigo && !i.otro && i.piezasPorPallet===item.piezasPorPallet);
    if(existing){ existing.cantidadPallet += item.cantidadPallet; savePL(pl); return pl; }
  }
  pl.items.push(item);
  savePL(pl);
  return pl;
}

/* ================= LISTAS (Mis / Todos) ================= */
function renderListas(all){
  let lists = DB.packinglists.filter(p=>p.estado!=='ENTRADA OK');
  if(!all) lists = lists.filter(p=>p.usuario===SESSION.usuario);
  else lists = lists.filter(p=>p.enviado!==false); // hide drafts not yet sent from admin/almacén view
  lists = lists.sort((a,b)=>b.creado-a.creado);

  let body;
  if(!lists.length){
    body = `<div class="empty-state"><div class="big">📋</div>Todavía no hay packing lists activos.</div>`;
  } else if(all){
    const byUser = {};
    lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
    body = Object.keys(byUser).sort().map(u=>`
      <details class="user-group" ${openGroup['L_'+u]?'open':''} data-group="L_${u}">
        <summary>${u} (${byUser[u].length})</summary>
        ${byUser[u].map(p=>renderPLCard(p)).join('')}
      </details>`).join('');
  } else {
    body = lists.map(p=>renderPLCard(p)).join('');
  }

  return `

function renderBlock(tipo, items, p, canEdit){
  if(!items.length) return '';
  const subtotal = items.reduce((s,i)=>s+i.cantidadPallet,0);
  const showConfirm = p.enviado!==false && p.estado!=='ENTRADA OK';
  const showUbic = items.some(i=>i.ubicacionPropuesta || i.ubicacionConfirmada);
  return `
  <div class="block-title">${tipo}</div>
  <div class="tbl-wrap"><table>
    <tr>${showConfirm?'<th></th>':''}<th>Código</th><th>Descripción</th><th>Pallets</th><th>Pzs/pallet</th>${showUbic?'<th>Ubicación</th>':''}${canEdit?'<th></th>':''}</tr>
    ${items.map(i=>`<tr class="${i.confirmado?'row-confirmado':''}">
      ${showConfirm?`<td>${i.confirmado?'<span title="Confirmado por lectura" style="color:var(--ok);font-weight:700;">✔</span>':'<span title="Pendiente de leer" style="color:var(--muted);">○</span>'}</td>`:''}
      <td>${escapeHtml(i.codigo)}${i.otro?'<span class="tag-otro">OTRO</span>':''}</td>
      <td>${escapeHtml(i.descripcion)}</td>
      <td>${i.cantidadPallet}</td>
      <td>${i.piezasPorPallet||'-'}</td>
      ${showUbic?`<td>${i.ubicacionConfirmada?`<b>${escapeHtml(i.ubicacionConfirmada)}</b>`:(i.ubicacionPropuesta?`<span style="color:var(--muted);">${escapeHtml(i.ubicacionPropuesta)} (propuesta)</span>`:'—')}</td>`:''}
      ${canEdit?`<td style="white-space:nowrap;">
        ${i.tipo==='EMBALAJE'?`<button class="btn btn-outline btn-sm" data-reprint="${p.id}|${i.id}">🖨️</button>`:''}

}

// Sugiere ubicaciones ya existentes en el stock para un código (para poder
// agrupar en la misma ubicación), excluyendo las zonas genéricas que no cuentan.
const UBICACIONES_EXCLUIDAS = ['GENERAL2','REEPF','UBI_PEDANE','MUESTR','PALLET_PRODUZIONE','GR-ZONE','GI-ZONE','DECIMB'];
function sugerirUbicaciones(codigo){
  if(!codigo || !DB.stockEmbalaje || !DB.stockEmbalaje.length) return [];
  const c = String(codigo).trim().toUpperCase();
  return DB.stockEmbalaje.filter(r=>
    String(r[1]).trim().toUpperCase()===c &&
    !UBICACIONES_EXCLUIDAS.includes(String(r[0]).trim().toUpperCase())
  );
}

// Si todas las líneas de un packing list ya están confirmadas por lectura,
// lo pasa automáticamente a COMPROBADA (si aún no lo estaba).
function checkAutoComprobada(p){
  // Solo aplica en la fase de comprobación inicial (SOL. ENVIADA). Si el
  // packing list ya avanzó más (PTE. DE UBICAR, UBICADO...), nunca lo
  // retrocede aunque se recalculen las confirmaciones de lectura.
  if(p.estado!=='SOL. ENVIADA' || !p.items.length) return false;
  const todoConfirmado = p.items.every(i=>i.confirmado);
  if(todoConfirmado){
    p.estado='COMPROBADA';
    p.historialEstados.push({estado:'COMPROBADA', usuario:SESSION.usuario+' (lectura automática)', fecha:Date.now()});
    return true;
  }
  return false;
}

function openScanModal(plId){
  const p = DB.packinglists.find(x=>x.id===plId);
  if(!p) return;
  const bg=document.createElement('div');
  bg.className='modal-bg';
  const renderList=()=>{
    const total=p.items.length, hechos=p.items.filter(i=>i.confirmado).length;
    return `
    <div class="modal" style="max-width:480px;">
      <h3>📷 Modo lectura — ${p.numero||''}</h3>
      <p>Escanea el QR de cada etiqueta con la pistola lectora. Se confirman solas al momento de leerlas (con Enter o automáticamente si la pistola no lo manda).</p>
      <div style="background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700;color:var(--brand-dark);">
        ${hechos} / ${total} confirmados
      </div>
      <input id="scanInput" placeholder="Aquí debe estar el foco al escanear…" autocomplete="off" style="width:100%;padding:12px 14px;border:2px solid var(--brand);border-radius:10px;font-size:15px;">
      <div id="scanFeedback" style="min-height:20px;margin-top:6px;font-size:13px;font-weight:700;"></div>
      <div id="scanList" style="max-height:260px;overflow-y:auto;margin-top:6px;">
        ${p.items.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px;">
          <span>${i.confirmado?'✔':'○'} ${escapeHtml(i.codigo)} <span style="color:var(--muted);">(${i.cantidadPallet} pallets)</span></span>
        </div>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn btn-outline" id="scanClose">Cerrar</button></div>
    </div>`;
  };
  bg.innerHTML = renderList();
  document.body.appendChild(bg);

  let debounceTimer=null;

  function focusInput(){ const el=bg.querySelector('#scanInput'); if(el) el.focus(); }
  function bindModalEvents(){
    bg.querySelector('#scanClose').onclick=()=>{ bg.remove(); render(); };
    const input = bg.querySelector('#scanInput');
    input.addEventListener('keydown', onKeydown);
    // Respaldo: si la pistola escanea pero no manda "Enter", confirma sola en
    // cuanto dejan de llegar caracteres (típico de una lectura rápida de pistola).
    input.addEventListener('input', ()=>{
      clearTimeout(debounceTimer);
      const val = input.value.trim();
      if(!val) return;
      debounceTimer = setTimeout(()=>{ procesarLectura(val); input.value=''; }, 200);
    });
    focusInput();
  }
  function refresh(){
    bg.innerHTML = renderList();
    bindModalEvents();
  }
  function procesarLectura(val){
    const feedback = bg.querySelector('#scanFeedback');
    const item = p.items.find(i=>i.id===val || i.codigo===val);
    if(!item){
      if(feedback){ feedback.style.color='var(--danger)'; feedback.textContent='⚠️ Ese código no pertenece a este packing list.'; }
      toast('⚠️ Ese código no pertenece a este packing list.');
      return;
    }
    if(item.confirmado){
      if(feedback){ feedback.style.color='var(--muted)'; feedback.textContent=`${item.codigo} ya estaba confirmado.`; }
      return;
    }
    item.confirmado = true;
    item.fechaConfirmado = Date.now();
    const autoComprobada = checkAutoComprobada(p);
    savePL(p);
    toast(`✔ ${item.codigo} confirmado.` + (autoComprobada ? ' Todo leído — packing list marcado COMPROBADA.' : ''));
    refresh();
    const feedback2 = bg.querySelector('#scanFeedback');
    if(feedback2){ feedback2.style.color='var(--ok)'; feedback2.textContent=`✔ ${item.codigo} confirmado`; }
  }
  function onKeydown(e){
    if(e.key!=='Enter') return;
    clearTimeout(debounceTimer);
    const val = e.target.value.trim();
    e.target.value='';
    if(!val) return;
    procesarLectura(val);
  }
  bindModalEvents();
  bg.onclick=(e)=>{ if(e.target===bg){ bg.remove(); render(); } };
}

function buildPackingListDocHtml(p, empresaOrigen, chofer, matVeh, matRem){

function openAddToPLModal(plId){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>Añadir artículo</h3>
    <div class="radio-row" id="mTipoRow">
      <button class="radio-chip on" data-mtipo="EMBALAJE">📦 EMBALAJE</button>
      <button class="radio-chip" data-mtipo="VIDRIO">🥃 VIDRIO</button>
    </div>
    <div class="field autocomplete"><label>Código</label><input id="mCodigo" autocomplete="off"><div id="mAcList"></div><div id="mMismatch"></div></div>
    <div class="field"><label>Descripción</label><div class="desc-preview" id="mDesc">—</div></div>
    <div class="grid2">
      <div class="field"><label>Pallets</label><input id="mPallets" type="number" min="0"></div>
      <div class="field"><label>Pzs/pallet</label><input id="mPiezas" type="number" min="0" placeholder="Introduce la cantidad"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancelar</button>
      <button class="btn btn-primary" id="mAdd">Añadir</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  let mTipo='EMBALAJE', mDescVal='';
  function checkMismatch(){
    const otherTipo = crossTypeMismatch(mTipo, mCodigo.value);
    const w = bg.querySelector('#mMismatch');
    if(otherTipo){
      w.innerHTML = `<div class="error-msg" style="margin-top:8px;">⚠️ El código pertenece a <b>${otherTipo}</b>, no a ${mTipo}.
        <button class="btn btn-sm btn-outline" style="margin-top:6px;" id="mSwitchTipo">Cambiar a ${otherTipo}</button></div>`;
      bg.querySelector('#mSwitchTipo').onclick=()=>{
        mTipo=otherTipo;
        bg.querySelectorAll('[data-mtipo]').forEach(x=>x.classList.toggle('on', x.dataset.mtipo===otherTipo));
        const found=findArticulo(otherTipo, mCodigo.value);
        if(found){ mDescVal=found[1]; bg.querySelector('#mDesc').textContent=mDescVal; }
        w.innerHTML='';
      };
    } else { w.innerHTML=''; }
  }
  bg.querySelectorAll('[data-mtipo]').forEach(b=>{
    b.onclick=()=>{ mTipo=b.dataset.mtipo; bg.querySelectorAll('[data-mtipo]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); checkMismatch(); };
  });
  const mCodigo=bg.querySelector('#mCodigo');
  mCodigo.oninput=()=>{
    const res=searchArticulos(mTipo, mCodigo.value);
    bg.querySelector('#mAcList').innerHTML = res.length? `<div class="ac-list">${res.map(r=>`<div class="ac-item" data-c="${escapeHtml(r[0])}" data-d="${(r[1]||'').replace(/"/g,'&quot;')}"><b>${escapeHtml(r[0])}</b><span>${escapeHtml(r[1]||'')}</span></div>`).join('')}</div>` : '';
    bg.querySelectorAll('.ac-item').forEach(it=>{
      it.onclick=()=>{ mCodigo.value=it.dataset.c; mDescVal=it.dataset.d; bg.querySelector('#mDesc').textContent=mDescVal; bg.querySelector('#mAcList').innerHTML=''; checkMismatch(); };
    });
    checkMismatch();
  };
  mCodigo.onblur=()=>{ setTimeout(()=>{
    const found=findArticulo(mTipo, mCodigo.value);
    if(found){ mDescVal=found[1]; bg.querySelector('#mDesc').textContent=mDescVal; }
    checkMismatch();
  },150); };
  bg.querySelector('#mCancel').onclick=()=>bg.remove();
  bg.querySelector('#mAdd').onclick=()=>{
    const pallets=Number(bg.querySelector('#mPallets').value);
    const piezas=Number(bg.querySelector('#mPiezas').value);
    if(!mCodigo.value.trim()||!pallets){ toast('Completa código y pallets.'); return; }
    if(!piezas){ toast('Indica las piezas por pallet.'); return; }
    if(mDescVal && crossTypeMismatch(mTipo, mCodigo.value)){ toast('Este código pertenece al otro tipo de material. Cámbialo antes de añadir.'); return; }
    const p=DB.packinglists.find(x=>x.id===plId);
    p.items.push({id:'it_'+Date.now()+Math.random().toString(36).slice(2,6), tipo:mTipo, codigo:mCodigo.value.trim(), descripcion:mDescVal||'(sin descripción)', piezasPorPallet:piezas, cantidadPallet:pallets, otro:!mDescVal});
    savePL(p); bg.remove(); render(); toast('Artículo añadido.');
  };
}

/* ================= COMPROBACIÓN (Capataz) ================= */
function renderComprobacion(){
  // Cada rol ve solo la fase que le toca a él; Admin las ve todas para
  // supervisar el proceso completo desde una sola pantalla.
  const rol = SESSION.rol;
  const porEstado = (estado) => DB.packinglists.filter(p=>p.estado===estado && p.enviado!==false).sort((a,b)=>b.creado-a.creado);

  const pendientes  = (rol==='capataz' || rol==='admin') ? porEstado('SOL. ENVIADA') : [];
  const comprobadas = (rol==='almacen' || rol==='admin') ? porEstado('COMPROBADA') : [];
  const pteUbicar    = (rol==='almacen' || rol==='admin') ? porEstado('PTE. DE UBICAR') : [];
  const ubicadas      = (rol==='admin') ? porEstado('UBICADO') : [];

  function groupByUser(lists){
    const byUser={};
    lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
    return byUser;
  }
  function renderGroup(lists, prefix){
    const byUser = groupByUser(lists);
    const users = Object.keys(byUser).sort();
    if(!users.length) return '';
    return users.map(u=>`
      <details class="user-group" ${openGroup[prefix+'_'+u]?'open':''} data-group="${prefix}_${u}">
        <summary>${u} (${byUser[u].length} entrada${byUser[u].length>1?'s':''})</summary>
        ${byUser[u].map(p=>renderPLCard(p)).join('')}
      </details>`).join('');
  }

  const subTexto = {
    capataz: 'Revisa cada packing list recibido y márcalo como comprobado.',
    almacen: 'Propón y confirma la ubicación de almacén para cada artículo comprobado.',
    admin: 'Supervisa las cuatro fases: comprobación, ubicación propuesta, ubicación confirmada y validación final.'
  }[rol] || '';

  const vacio = !pendientes.length && !comprobadas.length && !pteUbicar.length && !ubicadas.length;
  return `
  <div class="card">
    <h2>Comprobación de llegada de material</h2>
    <p class="sub">${subTexto}</p>
    ${vacio ? `<div class="empty-state"><div class="big">✅</div>No hay packing lists pendientes.</div>` : `
      ${pendientes.length ? `<div class="block-title">Pendientes de comprobar</div>${renderGroup(pendientes,'C')}` : ''}
      ${comprobadas.length ? `<div class="block-title">Comprobadas · pendientes de proponer ubicación</div>${renderGroup(comprobadas,'V')}` : ''}
      ${pteUbicar.length ? `<div class="block-title">Pendientes de confirmar ubicación definitiva</div>${renderGroup(pteUbicar,'U')}` : ''}
      ${ubicadas.length ? `<div class="block-title">Ubicadas · pendientes de validar (ENTRADA OK)</div>${renderGroup(ubicadas,'E')}` : ''}
    `}
  </div>`;
}
function bindComprobacion(){ bindListas(true); }

/* ================= HISTORIAL ================= */
function renderHistorial(){
  let lists = DB.packinglists.filter(p=>p.estado==='ENTRADA OK').sort((a,b)=>b.creado-a.creado);
  const isAdmin = SESSION.rol==='admin';
  if(!isAdmin) lists = lists.filter(p=>p.usuario===SESSION.usuario);

  let body;
  if(!lists.length){ body = `<div class="empty-state"><div class="big">🗂️</div>Todavía no hay packing lists en el histórico.</div>`; }
  else if(isAdmin){
    const byUser={};
    lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
    body = Object.keys(byUser).sort().map(u=>`
      <details class="user-group" ${openGroup['H_'+u]?'open':''} data-group="H_${u}">
        <summary>${u} (${byUser[u].length})</summary>
        ${byUser[u].map(p=>renderPLCard(p)).join('')}
      </details>`).join('');
  } else {
    body = lists.map(p=>renderPLCard(p)).join('');
  }
  return `<div class="card"><h2>Histórico</h2><p class="sub">Packing lists con estado ENTRADA OK.</p>${body}</div>`;
}
function bindHistorial(){ bindListas(true); }

  <button class="btn btn-primary" id="btnAddCho">+ Añadir chófer</button>`;
}

function renderCfgStock(){
  const q = CFG_STOCK_SEARCH || '';
  const list = q ? DB.stockEmbalaje.filter(r=>String(r[0]).toUpperCase().includes(q.toUpperCase()) || String(r[1]).toUpperCase().includes(q.toUpperCase())) : DB.stockEmbalaje;
  return `
  <div class="card" style="background:var(--brand-soft);box-shadow:none;padding:16px;margin-bottom:16px;">
    <b>Importar stock de embalaje (Excel)</b>
    <p class="sub" style="margin:4px 0 10px;">Columnas: B = Ubicación, C = Producto (código), D = Cantidad. Sube el archivo cada día para actualizarlo — reemplaza por completo el stock anterior.</p>
    <input type="file" id="fileImportStock" accept=".xlsx,.xls">
    <div id="importStockStatus" style="margin-top:8px;font-size:13px;color:var(--brand-dark);"></div>
  </div>

  <p class="sub">Ubicaciones excluidas de las sugerencias de agrupación: ${UBICACIONES_EXCLUIDAS.join(', ')}.</p>
  <input class="search-box" id="stockSearch" placeholder="Buscar por ubicación o código…" value="${escapeHtml(q)}">
  <div class="tbl-wrap" style="max-height:420px;overflow-y:auto;">
  <table>
    <tr><th>Ubicación</th><th>Producto (código)</th><th>Cantidad</th></tr>
    ${list.slice(0,300).map(r=>`<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1])}</td><td>${escapeHtml(r[2])}</td></tr>`).join('')}
  </table>
  </div>
  <p class="sub">${DB.stockEmbalaje.length} filas cargadas${list.length!==DB.stockEmbalaje.length?` · ${list.length} coinciden con la búsqueda`:''}${list.length>300?' (mostrando las primeras 300)':''}.</p>`;
}

function bindConfig(){
  document.querySelectorAll('[data-sub]').forEach(b=>{ b.onclick=()=>{ CFG_SUBTAB=b.dataset.sub; renderContent(); }; });
  if(CFG_SUBTAB==='usuarios') bindCfgUsuarios();
  else if(CFG_SUBTAB==='bbdd') bindCfgBBDD();
  else if(CFG_SUBTAB==='empresas') bindCfgEmpresas();
  else if(CFG_SUBTAB==='choferes') bindCfgChoferes();
  else bindCfgStock();
}
function bindCfgStock(){
  document.getElementById('stockSearch').oninput=(e)=>{ CFG_STOCK_SEARCH=e.target.value; renderContent(); };
  document.getElementById('fileImportStock').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const status = document.getElementById('importStockStatus');
    status.textContent = 'Leyendo el archivo…';
    const reader=new FileReader();
    reader.onload=async (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1});
        // Columnas fijas por posición: B=índice 1 (ubicación), C=índice 2 (producto), D=índice 3 (cantidad).
        const nuevo = rows.slice(1)
          .filter(r=>r[1]!=null && r[2]!=null)
          .map(r=>[String(r[1]).trim(), String(r[2]).trim(), r[3]!=null ? r[3] : '']);
        DB.stockEmbalaje = nuevo;
        renderContent();
        status.textContent = 'Guardando…';
        const ok = await persistStockEmbalaje();
        status.textContent = '';
        if(ok) toast(`Stock actualizado: ${nuevo.length} filas.`);
        else toast('Se leyó el archivo pero no se pudo guardar en el servidor.');
        renderContent();
      }catch(err){ console.error(err); status.textContent=''; toast('Error al leer el archivo. Comprueba el formato.'); }
    };
    reader.readAsArrayBuffer(file);
  };
}
function bindCfgEmpresas(){
  document.querySelectorAll('[data-emp-nombre]').forEach(inp=>{ inp.onchange=()=>{ DB.empresas[inp.dataset.empNombre].nombre=inp.value; persistEmpresas(); }; });
  document.querySelectorAll('[data-emp-dir]').forEach(inp=>{ inp.onchange=()=>{ DB.empresas[inp.dataset.empDir].direccion=inp.value; persistEmpresas(); }; });
  document.querySelectorAll('[data-emp-del]').forEach(b=>{ b.onclick=()=>{ DB.empresas.splice(Number(b.dataset.empDel),1); persistEmpresas(); renderContent(); }; });
  document.getElementById('btnAddEmp').onclick=()=>{
    const nombre=document.getElementById('newEmpNombre').value.trim();
    const direccion=document.getElementById('newEmpDir').value.trim();
    if(!nombre||!direccion){ toast('Completa nombre y dirección.'); return; }
    DB.empresas.push({nombre, direccion}); persistEmpresas(); toast('Empresa añadida.'); renderContent();
  };
}
function bindCfgChoferes(){
  document.querySelectorAll('[data-cho-nombre]').forEach(inp=>{ inp.onchange=()=>{ DB.choferes[inp.dataset.choNombre].nombre=inp.value; persistChoferes(); }; });
  document.querySelectorAll('[data-cho-veh]').forEach(inp=>{ inp.onchange=()=>{ DB.choferes[inp.dataset.choVeh].matriculaVehiculo=inp.value; persistChoferes(); }; });
  document.querySelectorAll('[data-cho-rem]').forEach(inp=>{ inp.onchange=()=>{ DB.choferes[inp.dataset.choRem].matriculaRemolque=inp.value; persistChoferes(); }; });
  document.querySelectorAll('[data-cho-del]').forEach(b=>{ b.onclick=()=>{ DB.choferes.splice(Number(b.dataset.choDel),1); persistChoferes(); renderContent(); }; });
  document.getElementById('btnAddCho').onclick=()=>{
    const nombre=document.getElementById('newChoNombre').value.trim();
    const matriculaVehiculo=document.getElementById('newChoVeh').value.trim();
    const matriculaRemolque=document.getElementById('newChoRem').value.trim();
    if(!nombre){ toast('Indica el nombre del chófer.'); return; }
    DB.choferes.push({nombre, matriculaVehiculo, matriculaRemolque}); persistChoferes(); toast('Chófer añadido.'); renderContent();
  };
}
function bindCfgUsuarios(){
  document.querySelectorAll('[data-savepassidx]').forEach(b=>{
    b.onclick=async ()=>{
      const idx=b.dataset.savepassidx;
      const input=document.querySelector(`[data-newpassidx="${idx}"]`);
      const val=input.value.trim();
      if(!val){ toast('Escribe la nueva contraseña primero.'); return; }
      b.disabled=true; b.textContent='Guardando…';
      const ok = await apiSetPassword(DB.users[idx].usuario, val);
      b.disabled=false; b.textContent='Cambiar';
      if(ok){ input.value=''; toast('Contraseña actualizada.'); } else { toast('No se pudo actualizar la contraseña.'); }
    };
  });
  document.querySelectorAll('[data-rolidx]').forEach(sel=>{ sel.onchange=async ()=>{ DB.users[sel.dataset.rolidx].rol=sel.value; await apiUpdateUserMeta(DB.users[sel.dataset.rolidx].usuario,{rol:sel.value}); toast('Rol actualizado.'); }; });
  document.querySelectorAll('[data-letraidx]').forEach(inp=>{ inp.onchange=async ()=>{ const letra=inp.value.toUpperCase().slice(0,1); DB.users[inp.dataset.letraidx].letra=letra; await apiUpdateUserMeta(DB.users[inp.dataset.letraidx].usuario,{letra}); }; });
  document.querySelectorAll('[data-toggleactive]').forEach(b=>{ b.onclick=async ()=>{ const u=DB.users[b.dataset.toggleactive]; u.activo = u.activo===false; await apiUpdateUserMeta(u.usuario,{activo:u.activo}); renderContent(); }; });
  document.getElementById('btnAddUser').onclick=async ()=>{
    const usuario=document.getElementById('newUsuario').value.trim();
    const password=document.getElementById('newPass').value.trim();
    const rol=document.getElementById('newRol').value;
    const letra=(document.getElementById('newLetra').value||'X').toUpperCase().slice(0,1);
    if(!usuario||!password){ toast('Completa usuario y contraseña.'); return; }
    if(DB.users.some(u=>u.usuario.toLowerCase()===usuario.toLowerCase())){ toast('Ese usuario ya existe.'); return; }
    const result = await apiAddUser({usuario,password,rol,letra,activo:true});
    if(result===true || (result && result.ok)){
      DB.users.push({usuario,rol,letra,activo:true}); // sin password en memoria del cliente
      toast('Usuario añadido.'); renderContent();
    } else {
      toast((result && result.error) || 'No se pudo añadir el usuario.');
    }
  };
}
function bindCfgBBDD(){
  document.querySelectorAll('[data-bbdd]').forEach(b=>{ b.onclick=()=>{ CFG_BBDD_TIPO=b.dataset.bbdd; renderContent(); }; });
  const list = CFG_BBDD_TIPO==='vidrio'?DB.vidrio:DB.embalaje;

  document.querySelectorAll('[data-code]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.code][0]=inp.value; persistArticulos(); }; });
  document.querySelectorAll('[data-desc]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.desc][1]=inp.value; persistArticulos(); }; });
  document.querySelectorAll('[data-pz]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.pz][2]=Number(inp.value)||0; persistArticulos(); }; });
  document.querySelectorAll('[data-delrow]').forEach(b=>{ b.onclick=()=>{ list.splice(Number(b.dataset.delrow),1); persistArticulos(); renderContent(); }; });

  document.getElementById('btnAddArt').onclick=()=>{
    const code=document.getElementById('newCode').value.trim();
    const desc=document.getElementById('newDesc').value.trim();
    const pz=Number(document.getElementById('newPz').value)||0;
    if(!code||!desc){ toast('Completa código y descripción.'); return; }
    list.unshift([code,desc,pz]); persistArticulos(); toast('Artículo añadido.'); renderContent();
  };

  document.getElementById('bbddSearch').oninput=(e)=>{
    const q=e.target.value.toUpperCase();
    const rows=document.querySelectorAll('#bbddTable tr');
    rows.forEach((r,i)=>{ if(i===0) return; r.style.display = r.textContent.toUpperCase().includes(q) ? '' : 'none'; });
  };

  document.getElementById('fileImport').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const status = document.getElementById('importStatus');
    status.textContent = 'Leyendo el archivo…';
    const reader=new FileReader();
    reader.onload=async (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        let importedV=0, importedE=0;
        if(wb.SheetNames.includes('Vidrio')){
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Vidrio'], {header:1});
          const header = rows[0].map(h=>String(h||'').toUpperCase());
          const ci = header.findIndex(h=>h.includes('CODICE'));
          const di = header.findIndex(h=>h.includes('DESCRIZIONE'));
          const pi = header.findIndex(h=>h.includes('PEZZI'));
          const newRows = rows.slice(1).filter(r=>r[ci]!=null).map(r=>[String(r[ci]), r[di]||'', Number(r[pi])||0]);
          DB.vidrio = newRows; importedV = newRows.length;
        }
        if(wb.SheetNames.includes('Embalaje')){
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Embalaje'], {header:1});
          const header = rows[0].map(h=>String(h||'').toUpperCase());
          const ci = header.findIndex(h=>h.includes('CODICE'));
          const di = header.findIndex(h=>h.includes('DESCRIZIONE'));
          const pi = header.findIndex(h=>h.includes('PEZZI'));
          const newRows = rows.slice(1).filter(r=>r[ci]!=null).map(r=>[String(r[ci]), r[di]||'', Number(r[pi])||0]);
          DB.embalaje = newRows; importedE = newRows.length;
        }
        renderContent(); // refleja el nuevo tamaño en las pestañas al momento

        // Guarda Vidrio y Embalaje en UNA sola petición atómica (un solo bloqueo
        // en el servidor), con reintento automático si falla la primera vez.
        status.textContent = `Guardando en la base de datos central… (${importedV+importedE} artículos, puede tardar unos segundos)`;
        let ok = await apiSetMany({articulos_vidrio: DB.vidrio, articulos_embalaje: DB.embalaje});
        if(!ok){
          status.textContent = 'No se pudo guardar, reintentando…';
          await new Promise(r=>setTimeout(r, 2000));
          ok = await apiSetMany({articulos_vidrio: DB.vidrio, articulos_embalaje: DB.embalaje});
        }

        if(ok){
          status.textContent = '';
          toast(`Importado y guardado: ${importedV} artículos de vidrio, ${importedE} de embalaje.`);
        } else {
          status.innerHTML = `<span style="color:var(--danger);">⚠️ Se leyó el archivo pero no se pudo guardar en el servidor tras dos intentos. Comprueba la conexión y vuelve a pulsar "Seleccionar archivo" para reintentarlo. Mientras tanto, NO recargues la página o perderás lo leído (aunque no se haya guardado, no se ha borrado nada del servidor).</span>`;
        }
        renderContent();
      }catch(err){ console.error(err); status.textContent=''; toast('Error al leer el archivo. Comprueba el formato.'); }
    };
    reader.readAsArrayBuffer(file);
  };
}

/* ---------------- init ---------------- */
let LOAD_PROMISE = null;

async function init(){
  render(); // pinta el login al instante, sin esperar a la red
  LOAD_PROMISE = loadAll().then(()=>{
    LOAD_PROMISE = null;
    if(!SESSION) render(); // repinta el login con los usuarios reales ya cargados
  });
  if(HAS_BACKEND){
    setInterval(()=>refreshFromServer(true), 15000); // refresco automático cada 15s

    // Al volver a la pestaña/app (móviles suelen pausar los timers en segundo plano),
    // refresca al instante en vez de esperar al siguiente ciclo de 15s.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') refreshFromServer(true);
    });
    window.addEventListener('focus', ()=>refreshFromServer(true));
  }
}
init();
</script>
