<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bormioli · Gestión de Devoluciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef2f4;
  --card:#ffffff;
  --ink:#1f2d34;
  --muted:#65787f;
  --line:#dfe6e9;
  --brand:#0e5b76;
  --brand-dark:#0a3f52;
  --brand-soft:#e4eff2;
  --accent:#c98a3e;
  --ok:#2f8f5b;
  --ok-soft:#e5f4ec;
  --warn:#b8862c;
  --warn-soft:#faf1de;
  --danger:#b7452f;
  --danger-soft:#fbe9e4;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,40,50,.06), 0 8px 24px rgba(20,40,50,.06);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
#app{max-width:1180px;margin:0 auto;padding:0 16px 60px;}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:12px;background:#fff;padding:8px 14px;border-radius:10px;box-shadow:0 1px 2px rgba(20,40,50,.06);}
.logo img{display:block;height:34px;width:auto;object-fit:contain;}
.logo-text{font-weight:600;font-size:11px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;padding-left:12px;border-left:1.5px solid var(--line);}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 15%,#f4f8f9,var(--bg) 60%);}
.login-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:38px 34px;width:100%;max-width:380px;}
.login-card .logo{justify-content:center;margin-bottom:22px;flex-direction:column;gap:10px;box-shadow:none;padding:10px 14px;}
.login-card .logo img{height:46px;}
.login-card .logo-text{border-left:none;padding-left:0;}
.login-card h1{font-size:16px;text-align:center;color:var(--muted);font-weight:500;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fbfcfd;transition:border-color .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);background:#fff;}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:transform .05s, opacity .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-block{width:100%;}
.btn-secondary{background:var(--brand-soft);color:var(--brand-dark);}
.btn-outline{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ok{background:var(--ok-soft);color:var(--ok);}
.btn-warn{background:var(--warn-soft);color:var(--warn);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.error-msg{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px;}
.demo-users{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;}

/* ---------- Top nav ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;position:sticky;top:0;background:var(--bg);z-index:20;}
.who{display:flex;align-items:center;gap:10px;}
.who .badge{background:var(--brand-soft);color:var(--brand-dark);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-ok{background:var(--ok);}
.sync-bad{background:var(--danger);}
.who .name{font-weight:600;font-size:14.5px;}
.logout{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:18px;border-bottom:1.5px solid var(--line);}
.tab{padding:9px 15px;border-radius:9px 9px 0 0;background:transparent;border:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;}
.tab.active{background:var(--card);color:var(--brand-dark);box-shadow:var(--shadow);}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
.card h2{margin:0 0 4px;font-size:18px;}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr;}}

.radio-row{display:flex;gap:10px;margin-bottom:16px;}
.radio-chip{flex:1;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);background:#fbfcfd;}
.radio-chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);}

.autocomplete{position:relative;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:240px;overflow-y:auto;z-index:30;box-shadow:0 10px 20px rgba(0,0,0,.08);}
.ac-item{padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line);}
.ac-item:hover{background:var(--brand-soft);cursor:pointer;}
.ac-item b{color:var(--brand-dark);}
.ac-item span{display:block;color:var(--muted);font-size:12px;}
.ac-empty{padding:10px 13px;font-size:13px;color:var(--muted);}

.desc-preview{background:var(--brand-soft);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--brand-dark);min-height:22px;margin-bottom:2px;}

/* ---------- Tables / lists ---------- */
table{width:100%;border-collapse:collapse;font-size:13.8px;}
th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:2px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}

.pl-card{border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.pl-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;background:#fbfcfd;flex-wrap:wrap;gap:8px;}
.pl-head:hover{background:var(--brand-soft);}
.pl-num{font-weight:700;color:var(--brand-dark);font-size:14.5px;}
.pl-meta{font-size:12px;color:var(--muted);}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.st-enviada{background:var(--warn-soft);color:var(--warn);}
.st-draft{background:#eee;color:var(--muted);}
.st-comprobada{background:var(--brand-soft);color:var(--brand-dark);}
.st-ok{background:var(--ok-soft);color:var(--ok);}
.pl-body{padding:16px;border-top:1.5px solid var(--line);display:none;}
.pl-body.open{display:block;}
.block-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;}
.block-title:first-child{margin-top:0;}
.total-row{display:flex;justify-content:space-between;font-weight:700;padding:8px 10px;font-size:13.5px;color:var(--brand-dark);}
.pl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.user-group{margin-bottom:22px;}
.user-group>summary{font-weight:700;font-size:14.5px;color:var(--brand-dark);cursor:pointer;padding:8px 0;list-style:none;}
.user-group>summary::-webkit-details-marker{display:none;}
.user-group>summary:before{content:"▸ ";}
.user-group[open]>summary:before{content:"▾ ";}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,35,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 8px;font-size:17px;}
.modal p{color:var(--muted);font-size:14px;line-height:1.5;}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* ---------- Config ---------- */
.subtabs{display:flex;gap:8px;margin-bottom:16px;}
.subtab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);}
.subtab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.search-box{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:14px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 25px rgba(0,0,0,.2);}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:32px;margin-bottom:8px;}
.tag-otro{background:var(--danger-soft);color:var(--danger);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}

/* ---------- Print ---------- */
#printArea{display:none;}
@media print{
  body>*{display:none !important;}
  #printArea{display:block !important;}
  @page{size:A4;margin:12mm;}
}
.label-sheet{width:100%;height:265mm;position:relative;font-family:Arial,Helvetica,sans-serif;border:3px solid var(--brand-dark, #0a3f52);border-radius:6px;padding:14mm 16mm;display:flex;flex-direction:column;}
.label-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #0a3f52;padding-bottom:10mm;margin-bottom:12mm;}
.label-code{font-size:54pt;font-weight:800;letter-spacing:1px;color:#0a3f52;line-height:1.05;word-break:break-word;}
.label-type{display:inline-block;background:#0a3f52;color:#fff;font-size:16pt;font-weight:700;padding:4mm 8mm;border-radius:6mm;letter-spacing:2px;}
.label-desc{font-size:26pt;font-weight:600;color:#1f2d34;margin:6mm 0 14mm;line-height:1.3;}
.label-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-top:auto;}
.label-box{border:2.5px solid #0a3f52;border-radius:5mm;padding:6mm 8mm;text-align:center;}
.label-box .lb{font-size:13pt;font-weight:700;color:#65787f;text-transform:uppercase;letter-spacing:1.5px;}
.label-box .lv{font-size:44pt;font-weight:800;color:#0a3f52;margin-top:2mm;}
.label-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12mm;}
.label-datetime{font-size:13pt;color:#65787f;font-weight:600;}
.label-side{position:absolute;top:14mm;right:-3px;bottom:14mm;width:16mm;background:#0a3f52;border-radius:0 4px 4px 0;display:flex;align-items:center;justify-content:center;}
.label-side span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:15pt;font-weight:700;letter-spacing:3px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   BORMIOLI · GESTIÓN DE DEVOLUCIÓN DE MATERIAL
   Single-file app. State persisted via window.storage (shared).
========================================================= */

let DB = { users: [], vidrio: [], embalaje: [], packinglists: [], counters: {} };
let SESSION = null;   // logged-in user object
let VIEW = 'nueva';
let CFG_SUBTAB = 'usuarios';
let CFG_BBDD_TIPO = 'vidrio';
let openPL = {};       // expanded state per PL id
let openGroup = {};    // expanded state per group key

const LETTERS = { BLalmacen:'B', Stylepack:'P', Trigo:'T', SEbl:'E', Admin:'A' };

function defaultUsers(){
  return [
    {usuario:'BLalmacen', password:'B1234', rol:'almacen',  letra:'B', activo:true},
    {usuario:'Stylepack', password:'S1234', rol:'operario', letra:'P', activo:true},
    {usuario:'Trigo',     password:'T1234', rol:'operario', letra:'T', activo:true},
    {usuario:'SEbl',      password:'S1234', rol:'operario', letra:'E', activo:true},
    {usuario:'Capataz',   password:'C123',  rol:'capataz',  letra:'-', activo:true},
    {usuario:'Admin',     password:'Razyel01', rol:'admin', letra:'A', activo:true},
  ];
}
function seedVidrio(){
  return [
    ['870216MTE032990','FIDO GHIERA SUP X VASI 125/200 CT2000',2000],
    ['870215MRU032990','FIDO GHIERA INF X VASI 125/200 CT800',800],
    ['890780M44021990','FIDO GUARNIZ GOMMA X TERRINE CT1000',1000],
    ['890750M44022990','FIDO GUARNIZ GOMMA X VASO ERM CT1000',1000],
    ['895051MRC022990','4S CAPS 56S/BPA 18 CT1250',1250],
    ['897615MDP022990','TAPPO ITA FIASC.ROSSO IN731 PP CT1400',1400],
    ['897616MDP022990','TAPPO ITA FIASC.NERO IN731 PP CT1400',1400],
    ['870200M44031990','GHIERA SUPER.X TUTTI VASI FIDO CT1000',1000],
  ];
}
function seedEmbalaje(){
  return [
    ['20080001','LONA VERDE ANTIVIBRATORIO',0],
    ['20080002','MANTA FILTRANTE VIDELON REF:PSV-27S-S-EY',0],
    ['20090003','PLÁSTICO DE BURBUJAS 150 ML 160 altura 8',0],
    ['20120023','PLIEGO MALLA S-280 VF 230x280 MUY FINO',0],
    ['40810110','ETIQUETA CIRCULAR AMARILLA Diam. 3,5 Cm',0],
    ['71018405','VC 600x400x140 (52267) PP',375],
  ];
}

/* =========================================================
   CONEXIÓN CON EL BACKEND (Google Apps Script + Google Sheets)
   ---------------------------------------------------------
   1) Despliega Code.gs como Aplicación web (ver instrucciones
      dentro de ese archivo) y copia la URL que termina en /exec.
   2) Pega esa URL aquí abajo, en APPS_SCRIPT_URL.
   Mientras APPS_SCRIPT_URL no esté configurada, la app funciona
   en modo local (solo en tu navegador, sin compartir datos).
========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-6KQcLAJzE8HLlFAw1V-1BWElTyd_MGC45l72SMAhZ_unzktsQ5GrkgC2CdRL2gWLDA/exec";
const HAS_BACKEND = !!APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('PEGA_AQUI');

const memoryStore = {}; // fallback usado solo si no hay backend configurado
let SYNC_OK = false;
let LAST_SYNC = null;

function setSyncStatus(ok){
  SYNC_OK = ok;
  const el = document.getElementById('syncDot');
  if(el){ el.className = 'sync-dot ' + (ok?'sync-ok':'sync-bad'); }
  const t = document.getElementById('syncText');
  if(t){ t.textContent = HAS_BACKEND ? (ok ? ('Sincronizado · '+fmtDateTime(new Date())) : 'Sin conexión') : 'Modo local (sin backend)'; }
}

async function apiGetAll(){
  if(!HAS_BACKEND) return null;
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getAll`);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'error');
    setSyncStatus(true);
    return j.data; // { key: "jsonString", ... }
  }catch(e){ console.error('apiGetAll error', e); setSyncStatus(false); return null; }
}

async function apiSet(key, value){
  if(!HAS_BACKEND){ memoryStore[key]=JSON.stringify(value); return true; }
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS
      body: JSON.stringify({action:'set', key, value: JSON.stringify(value)})
    });
    const j = await res.json();
    setSyncStatus(!!j.ok);
    return !!j.ok;
  }catch(e){ console.error('apiSet error', e); setSyncStatus(false); return false; }
}

// Genera el número de packing list de forma atómica en el servidor
// (evita duplicados si dos personas envían a la vez).
async function apiNextNumero(letra){
  if(!HAS_BACKEND){
    const year = new Date().getFullYear();
    const key = letra+'-'+year;
    DB.counters[key] = (DB.counters[key]||0)+1;
    apiSet('counters', DB.counters);
    return `${letra}-${year}-${String(DB.counters[key]).padStart(4,'0')}`;
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'nextNumero', letra, year:new Date().getFullYear()})
    });
    const j = await res.json();
    setSyncStatus(!!j.ok);
    if(j.ok) return j.numero;
  }catch(e){ console.error('apiNextNumero error', e); setSyncStatus(false); }
  // fallback local si falla la red, para no bloquear al usuario
  const year = new Date().getFullYear();
  return `${letra}-${year}-${String(Date.now()).slice(-4)}`;
}

function parseKV(kv, key, fallback){
  if(!kv || kv[key]===undefined || kv[key]===null || kv[key]==='') return fallback;
  try{ return JSON.parse(kv[key]); }catch(e){ return fallback; }
}

async function loadAll(){
  let kv = HAS_BACKEND ? await apiGetAll() : null;
  if(!kv) kv = memoryStore;

  DB.users = parseKV(kv,'users',null) || defaultUsers();
  DB.vidrio = parseKV(kv,'articulos_vidrio',null) || seedVidrio();
  DB.embalaje = parseKV(kv,'articulos_embalaje',null) || seedEmbalaje();
  DB.packinglists = parseKV(kv,'packinglists',[]);
  DB.counters = parseKV(kv,'counters',{});

  // primera vez: guarda los valores por defecto para que ya queden en el backend
  if(!kv['users']) await apiSet('users', DB.users);
  if(!kv['articulos_vidrio']) await apiSet('articulos_vidrio', DB.vidrio);
  if(!kv['articulos_embalaje']) await apiSet('articulos_embalaje', DB.embalaje);
}

function persistUsers(){ return apiSet('users', DB.users); }
function persistArticulos(){ return Promise.all([apiSet('articulos_vidrio', DB.vidrio), apiSet('articulos_embalaje', DB.embalaje)]); }
function persistPL(){ return apiSet('packinglists', DB.packinglists); }
function persistCounters(){ return apiSet('counters', DB.counters); }

/* Refresca los datos desde el servidor y vuelve a pintar (para ver lo que añaden otros usuarios) */
async function refreshFromServer(silent){
  if(!HAS_BACKEND) return;
  const kv = await apiGetAll();
  if(!kv) return;
  DB.users = parseKV(kv,'users',DB.users);
  DB.vidrio = parseKV(kv,'articulos_vidrio',DB.vidrio);
  DB.embalaje = parseKV(kv,'articulos_embalaje',DB.embalaje);
  DB.packinglists = parseKV(kv,'packinglists',DB.packinglists);
  DB.counters = parseKV(kv,'counters',DB.counters);
  if(document.querySelector('.modal-bg')) return; // no interrumpir si hay un modal abierto
  if(SESSION) render();
  if(!silent) toast('Datos actualizados.');
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function fmtDateTime(d){
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------------- Modal helper ---------------- */
function showModal({title, body, actions}){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${title}</h3><p>${body}</p><div class="modal-actions" id="modalActions"></div></div>`;
  document.body.appendChild(bg);
  const wrap=bg.querySelector('#modalActions');
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'btn-outline');
    b.textContent=a.label;
    b.onclick=()=>{ bg.remove(); a.onClick&&a.onClick(); };
    wrap.appendChild(b);
  });
  bg.onclick=(e)=>{ if(e.target===bg && actions.some(a=>a.dismiss)) bg.remove(); };
}

/* ---------------- Auth ---------------- */
function doLogin(usuario, password){
  const u = DB.users.find(x=>x.usuario.toLowerCase()===usuario.trim().toLowerCase() && x.activo!==false);
  if(!u || u.password!==password) return null;
  return u;
}

/* ---------------- Article lookup ---------------- */
function articleList(tipo){ return tipo==='VIDRIO' ? DB.vidrio : DB.embalaje; }
function findArticulo(tipo, codigo){
  const list = articleList(tipo);
  const c = String(codigo).trim().toUpperCase();
  return list.find(r=>String(r[0]).trim().toUpperCase()===c);
}
// Returns the OTHER tipo's name if the code exists there but not in the given tipo (mismatched material warning)
function crossTypeMismatch(tipo, codigo){
  if(!codigo || !codigo.trim()) return null;
  const otherTipo = tipo==='VIDRIO' ? 'EMBALAJE' : 'VIDRIO';
  if(findArticulo(tipo, codigo)) return null; // exists correctly in current tipo
  const foundOther = findArticulo(otherTipo, codigo);
  return foundOther ? otherTipo : null;
}
function searchArticulos(tipo, q){
  q = q.trim().toUpperCase();
  if(!q) return [];
  const list = articleList(tipo);
  return list.filter(r => String(r[0]).toUpperCase().includes(q) || String(r[1]).toUpperCase().includes(q)).slice(0,12);
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">${logoSvg(46)}<div class="logo-text">Devolución de material</div></div>
      ${!HAS_BACKEND ? `<div class="error-msg" style="text-align:left;">⚠️ Backend no configurado: la app funciona solo en este navegador y no se compartirá con nadie más. Configura <code>APPS_SCRIPT_URL</code> en el archivo HTML (ver Code.gs).</div>` : ''}
      <h1>Accede con tu usuario de almacén</h1>
      <div id="loginError"></div>
      <div class="field"><label>Usuario</label><input id="inUser" placeholder="Ej. BLalmacen" autocomplete="username"></div>
      <div class="field">
        <label>Contraseña</label>
        <input id="inPass" type="password" placeholder="••••••" autocomplete="current-password">
        <label style="display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:7px;cursor:pointer;">
          <input type="checkbox" id="chkShowPass" style="width:auto;"> Mostrar contraseña
        </label>
      </div>
      <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      <div class="demo-users">Cada usuario gestiona su propio material.<br>El administrador tiene acceso completo.</div>
    </div>
  </div>`;
}
function bindLogin(){
  const doIt=()=>{
    const u=document.getElementById('inUser').value, p=document.getElementById('inPass').value;
    const found=doLogin(u,p);
    if(found){ SESSION=found; VIEW = found.rol==='capataz'?'comprobacion':'nueva'; render(); }
    else document.getElementById('loginError').innerHTML=`<div class="error-msg">Usuario o contraseña incorrectos.</div>`;
  };
  document.getElementById('btnLogin').onclick=doIt;
  document.getElementById('inPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doIt(); });
  document.getElementById('chkShowPass').onchange=(e)=>{ document.getElementById('inPass').type = e.target.checked ? 'text' : 'password'; };
}

function bindNuevaEtiqueta(){
  document.querySelectorAll('[data-tipo]').forEach(b=>{
    b.onclick=()=>{ formState.tipo=b.dataset.tipo; formState.codigo=''; formState.descripcion=''; formState.piezas=''; formState.otro=false; renderContent(); };
  });
  const codigoInput=document.getElementById('fCodigo');
  document.getElementById('fOtro').onchange=(e)=>{ formState.otro=e.target.checked; formState.codigo=''; formState.descripcion=''; formState.piezas=''; renderContent(); };

  function showMismatchWarning(){
    const w = document.getElementById('mismatchWarning');
    if(!w) return;
    if(formState.otro){ w.innerHTML=''; return; }
    const otherTipo = crossTypeMismatch(formState.tipo, formState.codigo);
    if(otherTipo){
      w.innerHTML = `<div class="error-msg" style="margin-top:8px;">⚠️ El código <b>${formState.codigo}</b> pertenece a <b>${otherTipo}</b>, no a ${formState.tipo}.
        <button class="btn btn-sm btn-outline" style="margin-top:6px;" id="btnSwitchTipo">Cambiar a ${otherTipo}</button></div>`;
      const sw = document.getElementById('btnSwitchTipo');
      if(sw) sw.onclick=()=>{
        formState.tipo = otherTipo;
        const found = findArticulo(otherTipo, formState.codigo);
        if(found) formState.descripcion = found[1];
        renderContent();
      };
    } else { w.innerHTML=''; }
  }

  if(formState.otro){
    codigoInput.oninput=(e)=>{ formState.codigo=e.target.value; };
    document.getElementById('fDescManual').oninput=(e)=>{ formState.descripcion=e.target.value; };
  } else {
    codigoInput.oninput=(e)=>{
      formState.codigo=e.target.value;
      const results = searchArticulos(formState.tipo, e.target.value);
      const acList=document.getElementById('acList');
      if(!e.target.value.trim()){ acList.innerHTML=''; document.getElementById('mismatchWarning').innerHTML=''; return; }
      acList.innerHTML = `<div class="ac-list">${
        results.length ? results.map(r=>`<div class="ac-item" data-code="${r[0]}" data-desc="${(r[1]||'').replace(/"/g,'&quot;')}"><b>${r[0]}</b><span>${r[1]||''}</span></div>`).join('')
        : `<div class="ac-empty">Sin coincidencias en la base de datos.</div>`
      }</div>`;
      acList.querySelectorAll('.ac-item').forEach(item=>{
        item.onclick=()=>{
          formState.codigo=item.dataset.code;
          formState.descripcion=item.dataset.desc;
          acList.innerHTML='';
          renderContent();
        };
      });
      showMismatchWarning();
    };
    codigoInput.onblur=()=>{
      setTimeout(()=>{
        const found=findArticulo(formState.tipo, formState.codigo);
        if(found){ formState.descripcion=found[1]; renderContent(); }
        else { showMismatchWarning(); }
      },150);
    };
    showMismatchWarning();
  }

  document.getElementById('fPallets').oninput=(e)=>{ formState.pallets=e.target.value; };
  document.getElementById('fPiezas').oninput=(e)=>{ formState.piezas=e.target.value; };

  document.getElementById('btnLimpiar').onclick=()=>{ formState={tipo:formState.tipo, codigo:'', descripcion:'', piezas:'', pallets:'', otro:false}; renderContent(); };

  document.getElementById('btnGenerar').onclick=()=>{
    if(!formState.codigo.trim()){ toast('Introduce un código de artículo.'); return; }
    if(!formState.otro && !formState.descripcion){ toast('Ese código no existe en la base de datos. Marca "OTRO" si es necesario.'); return; }
    if(!formState.otro){
      const otherTipo = crossTypeMismatch(formState.tipo, formState.codigo);
      if(otherTipo){ toast(`Este código pertenece a ${otherTipo}, no a ${formState.tipo}. Cambia el tipo de material.`); return; }
    }
    if(!formState.pallets || Number(formState.pallets)<=0){ toast('Indica la cantidad de pallets.'); return; }
    if(!formState.piezas || Number(formState.piezas)<=0){ toast('Indica las piezas por pallet.'); return; }

    const item = {
      id: 'it_'+Date.now()+Math.random().toString(36).slice(2,6),
      tipo: formState.tipo,
      codigo: formState.codigo.trim(),
      descripcion: formState.descripcion.trim() || '(sin descripción)',
      piezasPorPallet: Number(formState.piezas)||0,
      cantidadPallet: Number(formState.pallets),
      otro: formState.otro
    };

    if(formState.tipo==='EMBALAJE'){
      printLabel(item, ()=>{
        showModal({
          title:'¿Agregar al packing list?',
          body:`${item.codigo} — ${item.cantidadPallet} pallet(s). ¿Quieres añadirlo a tu packing list en curso?`,
          actions:[
            {label:'No, gracias', cls:'btn-outline', dismiss:true},
            {label:'Sí, agregar', cls:'btn-primary', onClick:()=>{ addItemToPL(item); toast('Añadido al packing list.'); formState={tipo:'EMBALAJE',codigo:'',descripcion:'',piezas:'',pallets:'',otro:false}; renderContent(); }}
          ]
        });
      });
    } else {
      addItemToPL(item);
      toast('Añadido al packing list.');
      formState={tipo:'VIDRIO',codigo:'',descripcion:'',piezas:'',pallets:'',otro:false};
      renderContent();
    }
  };
}

/* Get or create the active (draft) PL for current user */
function getActivePL(forceNew){
  if(!forceNew){
    const existing = DB.packinglists.filter(p=>p.usuario===SESSION.usuario && p.enviado===false).sort((a,b)=>b.creado-a.creado)[0];
    if(existing) return existing;
  }
  const pl = {
    id: 'pl_'+Date.now()+Math.random().toString(36).slice(2,6),
    numero: null,
    usuario: SESSION.usuario,
    creado: Date.now(),
    estado: 'SOL. ENVIADA',
    enviado: false,
    historialEstados: [],
    items: []
  };
  DB.packinglists.push(pl);
  return pl;
}

async function confirmSendPL(plId){
  const p = DB.packinglists.find(x=>x.id===plId);
  if(!p) return;
  const letra = (DB.users.find(u=>u.usuario===p.usuario)||{}).letra || 'X';
  if(!p.numero) p.numero = await apiNextNumero(letra);
  p.enviado = true;
  p.fechaEnvio = Date.now();
  p.historialEstados.push({estado:'SOL. ENVIADA', usuario:SESSION.usuario, fecha:Date.now()});
  await persistPL();
}

function addItemToPL(item, forceNew){
  const pl = getActivePL(forceNew);
  if(!item.otro){
    const existing = pl.items.find(i=>i.tipo===item.tipo && i.codigo===item.codigo && !i.otro);
    if(existing){ existing.cantidadPallet += item.cantidadPallet; persistPL(); return pl; }
  }
  pl.items.push(item);
  persistPL();
  return pl;
}

/* ================= LISTAS (Mis / Todos) ================= */
function renderListas(all){
  let lists = DB.packinglists.filter(p=>p.estado!=='ENTRADA OK');
  if(!all) lists = lists.filter(p=>p.usuario===SESSION.usuario);
  else lists = lists.filter(p=>p.enviado!==false); // hide drafts not yet sent from admin/almacén view
  lists = lists.sort((a,b)=>b.creado-a.creado);

  let body;
  if(!lists.length){
    body = `<div class="empty-state"><div class="big">📋</div>Todavía no hay packing lists activos.</div>`;
  } else if(all){
    const byUser = {};
    lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
    body = Object.keys(byUser).sort().map(u=>`
      <details class="user-group" ${openGroup['L_'+u]?'open':''} data-group="L_${u}">
        <summary>${u} (${byUser[u].length})</summary>
        ${byUser[u].map(p=>renderPLCard(p)).join('')}
      </details>`).join('');
  } else {
    body = lists.map(p=>renderPLCard(p)).join('');
  }

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div><h2>${all?'Todos los packing lists':'Mis packing lists'}</h2><p class="sub">Estados: Borrador → SOL. ENVIADA → COMPROBADA → ENTRADA OK</p></div>
      ${!all ? `<button class="btn btn-secondary btn-sm" id="btnNuevoPL">+ Nuevo packing list</button>`:''}
    </div>
    ${body}
  </div>`;
}

function renderPLCard(p){
  const vidrio = p.items.filter(i=>i.tipo==='VIDRIO');
  const emb = p.items.filter(i=>i.tipo==='EMBALAJE');
  const totalPallets = p.items.reduce((s,i)=>s+i.cantidadPallet,0);
  const isDraft = p.enviado===false;
  const stCls = isDraft ? 'st-draft' : (p.estado==='SOL. ENVIADA'?'st-enviada':p.estado==='COMPROBADA'?'st-comprobada':'st-ok');
  const stLabel = isDraft ? 'BORRADOR' : p.estado;
  const canEdit = (p.estado!=='ENTRADA OK') && (SESSION.rol==='admin' || p.usuario===SESSION.usuario);
  const canDelete = SESSION.rol==='admin';
  return `
  <div class="pl-card">
    <div class="pl-head" data-pl="${p.id}">
      <div><div class="pl-num">${p.numero || 'Borrador (sin enviar)'}</div><div class="pl-meta">${p.usuario} · ${fmtDateTime(new Date(p.creado))} · ${totalPallets} pallets</div></div>
      <span class="status-pill ${stCls}">${stLabel}</span>
    </div>
    <div class="pl-body ${openPL[p.id]?'open':''}" id="body_${p.id}">
      ${renderBlock('VIDRIO', vidrio, p, canEdit)}
      ${renderBlock('EMBALAJE', emb, p, canEdit)}
      <div class="total-row"><span>TOTAL GENERAL</span><span>${totalPallets} pallets</span></div>
      <div class="pl-actions">
        ${isDraft && canEdit ? `<button class="btn btn-primary btn-sm" data-preview="${p.id}">👁 Vista previa y enviar</button>` : ''}
        ${!isDraft ? stateButtons(p) : ''}
        ${canEdit ? `<button class="btn btn-outline btn-sm" data-addto="${p.id}">+ Añadir artículo</button>`:''}
        ${canDelete ? `<button class="btn btn-danger btn-sm" data-deletepl="${p.id}">🗑 Eliminar</button>`:''}
      </div>
    </div>
  </div>`;
}

function renderBlock(tipo, items, p, canEdit){
  if(!items.length) return '';
  const subtotal = items.reduce((s,i)=>s+i.cantidadPallet,0);
  return `
  <div class="block-title">${tipo}</div>
  <div class="tbl-wrap"><table>
    <tr><th>Código</th><th>Descripción</th><th>Pallets</th><th>Pzs/pallet</th>${canEdit?'<th></th>':''}</tr>
    ${items.map(i=>`<tr>
      <td>${i.codigo}${i.otro?'<span class="tag-otro">OTRO</span>':''}</td>
      <td>${i.descripcion}</td>
      <td>${i.cantidadPallet}</td>
      <td>${i.piezasPorPallet||'-'}</td>
      ${canEdit?`<td style="white-space:nowrap;">
        ${i.tipo==='EMBALAJE'?`<button class="btn btn-outline btn-sm" data-reprint="${p.id}|${i.id}">🖨️</button>`:''}
        <button class="btn btn-danger btn-sm" data-removeitem="${p.id}|${i.id}">✕</button>
      </td>`:''}
    </tr>`).join('')}
  </table></div>
  <div class="total-row"><span>Subtotal ${tipo.toLowerCase()}</span><span>${subtotal} pallets</span></div>`;
}

function stateButtons(p){
  let btns='';
  if(p.estado==='SOL. ENVIADA' && (SESSION.rol==='capataz'||SESSION.rol==='admin')){
    btns += `<button class="btn btn-ok btn-sm" data-setstate="${p.id}|COMPROBADA">✔ Marcar COMPROBADA</button>`;
  }
  if(p.estado==='COMPROBADA' && SESSION.rol==='admin'){
    btns += `<button class="btn btn-ok btn-sm" data-setstate="${p.id}|ENTRADA OK">✔ Marcar ENTRADA OK</button>`;
  }
  if(p.estado==='COMPROBADA' && (SESSION.rol==='capataz'||SESSION.rol==='admin')){
    btns += `<button class="btn btn-warn btn-sm" data-setstate="${p.id}|SOL. ENVIADA">↺ Revertir a SOL. ENVIADA</button>`;
  }
  return btns;
}

        actions:[
          {label:'Cancelar', cls:'btn-outline', dismiss:true},
          {label:'Eliminar', cls:'btn-danger', onClick:()=>{ DB.packinglists=DB.packinglists.filter(x=>x.id!==id); persistPL(); toast('Packing list eliminado.'); render(); }}
        ]
      });
    };
  });
}

function openPreviewSendModal(plId){
  const p = DB.packinglists.find(x=>x.id===plId);
  if(!p) return;
  const vidrio = p.items.filter(i=>i.tipo==='VIDRIO');
  const emb = p.items.filter(i=>i.tipo==='EMBALAJE');
  const totalPallets = p.items.reduce((s,i)=>s+i.cantidadPallet,0);
  if(!p.items.length){ toast('Añade al menos un artículo antes de enviar.'); return; }
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" style="max-width:560px;">
    <h3>Vista previa del packing list</h3>
    <p>Revisa el contenido antes de enviarlo a Capataz y Admin para su validación.</p>
    <div style="max-height:50vh;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;">
      ${renderBlock('VIDRIO', vidrio, p, false)}
      ${renderBlock('EMBALAJE', emb, p, false)}
      <div class="total-row"><span>TOTAL GENERAL</span><span>${totalPallets} pallets</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="pvCancel">Seguir editando</button>
      <button class="btn btn-primary" id="pvConfirm">✔ Confirmar y enviar</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#pvCancel').onclick=()=>bg.remove();
  bg.querySelector('#pvConfirm').onclick=async ()=>{
    const btn = bg.querySelector('#pvConfirm');
    btn.disabled = true; btn.textContent = 'Enviando…';
    await confirmSendPL(plId);
    bg.remove();
    toast('Packing list enviado a validación.');
    render();
  };
}

function openAddToPLModal(plId){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>Añadir artículo</h3>
    <div class="radio-row" id="mTipoRow">
      <button class="radio-chip on" data-mtipo="EMBALAJE">📦 EMBALAJE</button>
      <button class="radio-chip" data-mtipo="VIDRIO">🥃 VIDRIO</button>
    </div>
    <div class="field autocomplete"><label>Código</label><input id="mCodigo" autocomplete="off"><div id="mAcList"></div><div id="mMismatch"></div></div>
    <div class="field"><label>Descripción</label><div class="desc-preview" id="mDesc">—</div></div>
    <div class="grid2">
      <div class="field"><label>Pallets</label><input id="mPallets" type="number" min="0"></div>
      <div class="field"><label>Pzs/pallet</label><input id="mPiezas" type="number" min="0" placeholder="Introduce la cantidad"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancelar</button>
      <button class="btn btn-primary" id="mAdd">Añadir</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  let mTipo='EMBALAJE', mDescVal='';
  function checkMismatch(){
    const otherTipo = crossTypeMismatch(mTipo, mCodigo.value);
    const w = bg.querySelector('#mMismatch');
    if(otherTipo){
      w.innerHTML = `<div class="error-msg" style="margin-top:8px;">⚠️ El código pertenece a <b>${otherTipo}</b>, no a ${mTipo}.
        <button class="btn btn-sm btn-outline" style="margin-top:6px;" id="mSwitchTipo">Cambiar a ${otherTipo}</button></div>`;
      bg.querySelector('#mSwitchTipo').onclick=()=>{
        mTipo=otherTipo;
        bg.querySelectorAll('[data-mtipo]').forEach(x=>x.classList.toggle('on', x.dataset.mtipo===otherTipo));
        const found=findArticulo(otherTipo, mCodigo.value);
        if(found){ mDescVal=found[1]; bg.querySelector('#mDesc').textContent=mDescVal; }
        w.innerHTML='';
      };
    } else { w.innerHTML=''; }
  }
  bg.querySelectorAll('[data-mtipo]').forEach(b=>{
    b.onclick=()=>{ mTipo=b.dataset.mtipo; bg.querySelectorAll('[data-mtipo]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); checkMismatch(); };
  });
  const mCodigo=bg.querySelector('#mCodigo');
  mCodigo.oninput=()=>{
    const res=searchArticulos(mTipo, mCodigo.value);
    bg.querySelector('#mAcList').innerHTML = res.length? `<div class="ac-list">${res.map(r=>`<div class="ac-item" data-c="${r[0]}" data-d="${(r[1]||'').replace(/"/g,'&quot;')}"><b>${r[0]}</b><span>${r[1]||''}</span></div>`).join('')}</div>` : '';
    bg.querySelectorAll('.ac-item').forEach(it=>{
      it.onclick=()=>{ mCodigo.value=it.dataset.c; mDescVal=it.dataset.d; bg.querySelector('#mDesc').textContent=mDescVal; bg.querySelector('#mAcList').innerHTML=''; checkMismatch(); };
    });
    checkMismatch();
  };
  mCodigo.onblur=()=>{ setTimeout(()=>{
    const found=findArticulo(mTipo, mCodigo.value);
    if(found){ mDescVal=found[1]; bg.querySelector('#mDesc').textContent=mDescVal; }
    checkMismatch();
  },150); };
  bg.querySelector('#mCancel').onclick=()=>bg.remove();
  bg.querySelector('#mAdd').onclick=()=>{
    const pallets=Number(bg.querySelector('#mPallets').value);
    const piezas=Number(bg.querySelector('#mPiezas').value);
    if(!mCodigo.value.trim()||!pallets){ toast('Completa código y pallets.'); return; }
    if(!piezas){ toast('Indica las piezas por pallet.'); return; }
    if(mDescVal && crossTypeMismatch(mTipo, mCodigo.value)){ toast('Este código pertenece al otro tipo de material. Cámbialo antes de añadir.'); return; }
    const p=DB.packinglists.find(x=>x.id===plId);
    p.items.push({id:'it_'+Date.now()+Math.random().toString(36).slice(2,6), tipo:mTipo, codigo:mCodigo.value.trim(), descripcion:mDescVal||'(sin descripción)', piezasPorPallet:piezas, cantidadPallet:pallets, otro:!mDescVal});
    persistPL(); bg.remove(); render(); toast('Artículo añadido.');
  };
}

/* ================= COMPROBACIÓN (Capataz) ================= */
function renderComprobacion(){
  const lists = DB.packinglists.filter(p=>p.estado==='SOL. ENVIADA' && p.enviado!==false).sort((a,b)=>b.creado-a.creado);
  const byUser={};
  lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
  const users = Object.keys(byUser).sort();
  return `
  <div class="card">
    <h2>Comprobación de llegada de material</h2>
    <p class="sub">Revisa cada packing list recibido y márcalo como comprobado.</p>
    ${!users.length ? `<div class="empty-state"><div class="big">✅</div>No hay packing lists pendientes de comprobar.</div>` :
      users.map(u=>`
        <details class="user-group" ${openGroup['C_'+u]?'open':''} data-group="C_${u}">
          <summary>${u} (${byUser[u].length} entrada${byUser[u].length>1?'s':''})</summary>
          ${byUser[u].map(p=>renderPLCard(p)).join('')}
        </details>`).join('')}
  </div>`;
}
function bindComprobacion(){ bindListas(true); }

/* ================= HISTORIAL ================= */
function renderHistorial(){
  let lists = DB.packinglists.filter(p=>p.estado==='ENTRADA OK').sort((a,b)=>b.creado-a.creado);
  const isAdmin = SESSION.rol==='admin' || SESSION.rol==='almacen';
  if(!isAdmin) lists = lists.filter(p=>p.usuario===SESSION.usuario);

  let body;
  if(!lists.length){ body = `<div class="empty-state"><div class="big">🗂️</div>Todavía no hay packing lists en el histórico.</div>`; }
  else if(isAdmin){
    const byUser={};
    lists.forEach(p=>{ (byUser[p.usuario]=byUser[p.usuario]||[]).push(p); });
    body = Object.keys(byUser).sort().map(u=>`
      <details class="user-group" ${openGroup['H_'+u]?'open':''} data-group="H_${u}">
        <summary>${u} (${byUser[u].length})</summary>
        ${byUser[u].map(p=>renderPLCard(p)).join('')}
      </details>`).join('');
  } else {
    body = lists.map(p=>renderPLCard(p)).join('');
  }
  return `<div class="card"><h2>Histórico</h2><p class="sub">Packing lists con estado ENTRADA OK.</p>${body}</div>`;
}
function bindHistorial(){ bindListas(true); }

/* ================= CONFIGURACIÓN (Admin) ================= */
function renderConfig(){
  return `
  <div class="card">
    <h2>Configuración</h2>
    <div class="subtabs">
      <button class="subtab ${CFG_SUBTAB==='usuarios'?'active':''}" data-sub="usuarios">Usuarios</button>
      <button class="subtab ${CFG_SUBTAB==='bbdd'?'active':''}" data-sub="bbdd">Base de datos de artículos</button>
    </div>
    <div id="cfgBody">${CFG_SUBTAB==='usuarios' ? renderCfgUsuarios() : renderCfgBBDD()}</div>
  </div>`;
}
function renderCfgUsuarios(){
  return `
  <div class="tbl-wrap"><table>
    <tr><th>Usuario</th><th>Contraseña</th><th>Rol</th><th>Letra PL</th><th>Estado</th><th></th></tr>
    ${DB.users.map((u,idx)=>`<tr>
      <td>${u.usuario}</td>
      <td><input class="search-box" style="margin:0;padding:6px 9px;font-size:13px;" data-passidx="${idx}" value="${u.password}"></td>
      <td>
        <select data-rolidx="${idx}" style="padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);">
          ${['operario','almacen','capataz','admin'].map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${rolLabel(r)}</option>`).join('')}
        </select>
      </td>
      <td><input data-letraidx="${idx}" value="${u.letra}" style="width:40px;padding:6px;text-align:center;border-radius:8px;border:1.5px solid var(--line);"></td>
      <td>${u.activo!==false?'<span class="status-pill st-ok">Activo</span>':'<span class="status-pill st-enviada">Inactivo</span>'}</td>
      <td><button class="btn btn-sm ${u.activo!==false?'btn-danger':'btn-ok'}" data-toggleactive="${idx}">${u.activo!==false?'Desactivar':'Activar'}</button></td>
    </tr>`).join('')}
  </table></div>

  <h3 style="margin-top:22px;font-size:15px;">Añadir nuevo usuario / perfil de tercista</h3>
  <div class="grid3">
    <div class="field"><label>Usuario</label><input id="newUsuario" placeholder="Ej. NuevoTercista"></div>
    <div class="field"><label>Contraseña</label><input id="newPass" placeholder="Contraseña"></div>
    <div class="field"><label>Rol</label>
      <select id="newRol" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;">
        <option value="operario">Tercista</option>
        <option value="almacen">Almacén</option>
        <option value="capataz">Capataz</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>
  <div class="field" style="max-width:160px;"><label>Letra para packing list</label><input id="newLetra" maxlength="1" placeholder="Ej. N" style="text-transform:uppercase;"></div>
  <button class="btn btn-primary" id="btnAddUser">+ Añadir usuario</button>`;
}
function renderCfgBBDD(){
  const list = CFG_BBDD_TIPO==='vidrio'?DB.vidrio:DB.embalaje;
  return `
  <div class="subtabs">
    <button class="subtab ${CFG_BBDD_TIPO==='vidrio'?'active':''}" data-bbdd="vidrio">Vidrio (${DB.vidrio.length})</button>
    <button class="subtab ${CFG_BBDD_TIPO==='embalaje'?'active':''}" data-bbdd="embalaje">Embalaje (${DB.embalaje.length})</button>
  </div>

  <div class="card" style="background:var(--brand-soft);box-shadow:none;padding:16px;margin-bottom:16px;">
    <b>Importar desde Excel (BBDD.xlsx)</b>
    <p class="sub" style="margin:4px 0 10px;">Sube el archivo original con las hojas "Vidrio" y "Embalaje" para cargar o actualizar toda la base de datos.</p>
    <input type="file" id="fileImport" accept=".xlsx,.xls">
  </div>

  <input class="search-box" id="bbddSearch" placeholder="Buscar por código o descripción…">
  <div class="tbl-wrap" style="max-height:420px;overflow-y:auto;">
  <table id="bbddTable">
    <tr><th>Código</th><th>Descripción</th><th>Pzs/pallet</th><th></th></tr>
    ${list.slice(0,200).map((r,idx)=>`<tr>
      <td><input data-code="${idx}" value="${r[0]}" style="width:120px;padding:5px;border-radius:6px;border:1px solid var(--line);"></td>
      <td><input data-desc="${idx}" value="${(r[1]||'').replace(/"/g,'&quot;')}" style="width:100%;padding:5px;border-radius:6px;border:1px solid var(--line);"></td>
      <td><input data-pz="${idx}" type="number" value="${r[2]||0}" style="width:80px;padding:5px;border-radius:6px;border:1px solid var(--line);"></td>
      <td><button class="btn btn-sm btn-danger" data-delrow="${idx}">✕</button></td>
    </tr>`).join('')}
  </table>
  </div>
  ${list.length>200?`<p class="sub">Mostrando los primeros 200 de ${list.length}. Usa el buscador para filtrar.</p>`:''}

  <h3 style="margin-top:20px;font-size:15px;">Añadir artículo manualmente</h3>
  <div class="grid3">
    <div class="field"><label>Código</label><input id="newCode"></div>
    <div class="field"><label>Descripción</label><input id="newDesc"></div>
    <div class="field"><label>Pzs/pallet</label><input id="newPz" type="number"></div>
  </div>
  <button class="btn btn-primary" id="btnAddArt">+ Añadir artículo</button>`;
}

function bindConfig(){
  document.querySelectorAll('[data-sub]').forEach(b=>{ b.onclick=()=>{ CFG_SUBTAB=b.dataset.sub; renderContent(); }; });
  if(CFG_SUBTAB==='usuarios') bindCfgUsuarios(); else bindCfgBBDD();
}
function bindCfgUsuarios(){
  document.querySelectorAll('[data-passidx]').forEach(inp=>{ inp.onchange=()=>{ DB.users[inp.dataset.passidx].password=inp.value; persistUsers(); toast('Contraseña actualizada.'); }; });
  document.querySelectorAll('[data-rolidx]').forEach(sel=>{ sel.onchange=()=>{ DB.users[sel.dataset.rolidx].rol=sel.value; persistUsers(); toast('Rol actualizado.'); }; });
  document.querySelectorAll('[data-letraidx]').forEach(inp=>{ inp.onchange=()=>{ DB.users[inp.dataset.letraidx].letra=inp.value.toUpperCase().slice(0,1); persistUsers(); }; });
  document.querySelectorAll('[data-toggleactive]').forEach(b=>{ b.onclick=()=>{ const u=DB.users[b.dataset.toggleactive]; u.activo = u.activo===false; persistUsers(); renderContent(); }; });
  document.getElementById('btnAddUser').onclick=()=>{
    const usuario=document.getElementById('newUsuario').value.trim();
    const password=document.getElementById('newPass').value.trim();
    const rol=document.getElementById('newRol').value;
    const letra=(document.getElementById('newLetra').value||'X').toUpperCase().slice(0,1);
    if(!usuario||!password){ toast('Completa usuario y contraseña.'); return; }
    if(DB.users.some(u=>u.usuario.toLowerCase()===usuario.toLowerCase())){ toast('Ese usuario ya existe.'); return; }
    DB.users.push({usuario,password,rol,letra,activo:true});
    persistUsers(); toast('Usuario añadido.'); renderContent();
  };
}
function bindCfgBBDD(){
  document.querySelectorAll('[data-bbdd]').forEach(b=>{ b.onclick=()=>{ CFG_BBDD_TIPO=b.dataset.bbdd; renderContent(); }; });
  const list = CFG_BBDD_TIPO==='vidrio'?DB.vidrio:DB.embalaje;

  document.querySelectorAll('[data-code]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.code][0]=inp.value; persistArticulos(); }; });
  document.querySelectorAll('[data-desc]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.desc][1]=inp.value; persistArticulos(); }; });
  document.querySelectorAll('[data-pz]').forEach(inp=>{ inp.onchange=()=>{ list[inp.dataset.pz][2]=Number(inp.value)||0; persistArticulos(); }; });
  document.querySelectorAll('[data-delrow]').forEach(b=>{ b.onclick=()=>{ list.splice(Number(b.dataset.delrow),1); persistArticulos(); renderContent(); }; });

  document.getElementById('btnAddArt').onclick=()=>{
    const code=document.getElementById('newCode').value.trim();
    const desc=document.getElementById('newDesc').value.trim();
    const pz=Number(document.getElementById('newPz').value)||0;
    if(!code||!desc){ toast('Completa código y descripción.'); return; }
    list.unshift([code,desc,pz]); persistArticulos(); toast('Artículo añadido.'); renderContent();
  };

  document.getElementById('bbddSearch').oninput=(e)=>{
    const q=e.target.value.toUpperCase();
    const rows=document.querySelectorAll('#bbddTable tr');
    rows.forEach((r,i)=>{ if(i===0) return; r.style.display = r.textContent.toUpperCase().includes(q) ? '' : 'none'; });
  };

  document.getElementById('fileImport').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        let importedV=0, importedE=0;
        if(wb.SheetNames.includes('Vidrio')){
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Vidrio'], {header:1});
          const header = rows[0].map(h=>String(h||'').toUpperCase());
          const ci = header.findIndex(h=>h.includes('CODICE'));
          const di = header.findIndex(h=>h.includes('DESCRIZIONE'));
          const pi = header.findIndex(h=>h.includes('PEZZI'));
          const newRows = rows.slice(1).filter(r=>r[ci]!=null).map(r=>[String(r[ci]), r[di]||'', Number(r[pi])||0]);
          DB.vidrio = newRows; importedV = newRows.length;
        }
        if(wb.SheetNames.includes('Embalaje')){
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Embalaje'], {header:1});
          const header = rows[0].map(h=>String(h||'').toUpperCase());
          const ci = header.findIndex(h=>h.includes('CODICE'));
          const di = header.findIndex(h=>h.includes('DESCRIZIONE'));
          const pi = header.findIndex(h=>h.includes('PEZZI'));
          const newRows = rows.slice(1).filter(r=>r[ci]!=null).map(r=>[String(r[ci]), r[di]||'', Number(r[pi])||0]);
          DB.embalaje = newRows; importedE = newRows.length;
        }
        persistArticulos();
        toast(`Importado: ${importedV} artículos de vidrio, ${importedE} de embalaje.`);
        renderContent();
      }catch(err){ console.error(err); toast('Error al leer el archivo. Comprueba el formato.'); }
    };
    reader.readAsArrayBuffer(file);
  };
}

/* ---------------- init ---------------- */
async function init(){
  document.getElementById('app').innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;">${logoSvg(34)}<p style="color:var(--muted);margin-top:14px;">Cargando…</p></div></div>`;
  await loadAll();
  render();
  if(HAS_BACKEND){
    setInterval(()=>refreshFromServer(true), 20000); // refresco automático cada 20s
  }
}
init();
</script>
